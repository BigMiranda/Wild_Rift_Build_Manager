# Public, read-only version (Rodada 11, docs/rodada-11.md): `--spring.profiles.active=publico`.
planner.public=true

# The database exported by `./mvnw -Pexport` (or Admin > Exportar), opened read-only: nothing is ever written to it.
planner.db-path=./data/publico/ornn-planner-publico.db
spring.datasource.url=jdbc:sqlite:${planner.db-path}?open_mode=1&foreign_keys=on&busy_timeout=5000
# read-only: several readers at once are fine (the pool must agree with the open mode, or sqlite-jdbc refuses)
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=4

# Behind a proxy (VPS, container service), the visitor's IP and https come from the X-Forwarded-* headers.
server.forward-headers-strategy=native

# Limits per IP and per calculation (PublicLimits).
planner.public.compute-per-minute=30
planner.public.requests-per-minute=600
planner.public.compute-seconds=20
planner.public.workers=2
planner.public.arena-max-seconds=30
planner.public.effect-jobs=6
# Other sites allowed to call the API (comma separated); empty = only the page served by this server.
planner.public.allowed-origins=

# Builds the visitors share (Rodada 11, part 4): a database of its own, the only file the public version writes.
planner.community.db-path=./data/comunidade/comunidade.db
planner.community.per-anon-per-hour=20
planner.community.per-ip-per-hour=40
planner.community.max-bytes=16384
# the light background election: every so many minutes, builds with at least so many votes, candidates per champion
planner.community.interval-minutes=10
planner.community.min-votes=3
planner.community.candidates-per-champion=3
# GET /api/community/candidates needs this token in X-Admin-Token; empty = the endpoint does not exist.
# Set it in the environment (PLANNER_COMMUNITY_ADMIN_TOKEN), never in a versioned file.
planner.community.admin-token=
