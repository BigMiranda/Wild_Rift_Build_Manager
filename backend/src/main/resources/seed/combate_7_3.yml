# Quando cada efeito condicional do planejador vale na Arena. Chave: "Item|Efeito" (efeitos_itens), "Item|Passiva"
# (linhas condicionais da loja), runa ou efeito de campeão. O status que o efeito dá (com a Forja Viva e o resto da
# build) é a diferença entre a build com ele ligado e desligado; escudos e curas são dados no acionamento.
#   quando  inicio           desde o começo da luta
#           fora_de_combate  até o primeiro dano dado ou sofrido (`ate: ataque`: até o primeiro ataque)
#           combate          depois de `segundos` em combate, `acertos` dados ou `acertos_sofridos` (de habilidades)
#           vida_abaixo      dano que deixa a Vida abaixo de `vida` (`dano_tipo` restringe)
#           vida_acima       enquanto a Vida está acima de `vida`
#           escala_vida      cresce com a Vida perdida até o máximo abaixo de `vida`
#           ativo            ativo do item: ordem na linha do tempo ou, sem ordem, sozinho com a Vida abaixo de
#                            `auto_vida_abaixo` (`auto_controlado`: ao sofrer imobilização)
#           ao_usar_ult      ao conjurar a ultimate
#           ao_conjurar      ao conjurar qualquer habilidade
#           ao_atacar        ataque que acerta um Campeão
#           ao_causar_dano   dano num Campeão (`dano_tipo`, `de`: ataque | habilidade)
#           ao_sofrer_dano   dano de um Campeão (`dano_tipo`)
#           ao_sofrer_critico  acerto crítico sofrido
#           ao_controlar     Lentidão ou imobilização num Campeão (`so_imobilizar`)
#           ao_imobilizar    imobilização num Campeão
#           ao_ser_imobilizado  imobilização sofrida (`ou_imobilizar`: também ao imobilizar)
#           golpe_do_item    junto do golpe do `item` (Eclipse)
#           excesso_de_cura  a cura do Roubo de Vida acima da Vida máxima vira escudo, até o valor do efeito
#           ao_curar_aliado  ao curar ou proteger um aliado
#           abate            um Campeão que ele feriu nos últimos 3s morre
#           ao_morrer        dano letal (Anjo Guardião: `estase` s e volta com a cura do efeito)
#           acertos_janela   `acertos` em Campeões em `janela` s
#           dano_sofrido_janela  mais de `limite` de dano sofrido em `janela` s
#           periodico        a cada `a_cada` s em combate
#           estatico         depende da partida (abates, acúmulos, mana): segue a escolha da build, a luta toda
#           modelado         o efeito de combate do item / runa já faz o que ele faz (a cura do status sai da conta)
#           nunca            não acontece numa luta da Arena (`nota` diz por quê)
#   duracao (s; sem ela, até o fim da luta), duracao_escudo, decai (o escudo cai até zero na duração), recarga
#   (+ recarga_nv15), por_acionamento (o valor do efeito com a opção em 1: cada acionamento vale isso),
#   acumulos (até N; cada um vale 1/N do efeito, ou o efeito inteiro com por_acionamento), cura_ao_longo (s),
#   estase (s), purifica, reduz_recargas (fração das recargas restantes das básicas), velocidade (+% de VdM, com
#   _nv15), cura_vida_perdida (fração da Vida perdida, no lugar da cura do efeito), cura_fixa, reduz_golpes {golpes,
#   valor, valor_nv15, janela}, dano {dano, vida_bonus, dano_tipo, raio}
