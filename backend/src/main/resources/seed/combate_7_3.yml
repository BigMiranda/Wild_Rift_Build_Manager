# Efeitos de combate dos itens para o simulador de confronto (patch 7.3): o que depende do inimigo e não cabe nos
# status (dano dos itens, redução de resistência, Feridas Dolorosas, corte de escudo, amplificação e redução de dano).
# Status planos (penetração, crítico, roubo de vida...) e status efetivos (escudos, curas, estase) vêm do cálculo da
# build; aqui ficam só os efeitos que acontecem na luta. Valores de Campeões corpo a corpo quando o texto diferencia.
#
# Tipos (campo `tipo`):
#   ao_contato     ataques causam `dano` (+ `pdh` x PdH, + `vida_atual_alvo` x Vida atual do alvo) de `dano_tipo`
#   a_cada_ataque  todo `n`º ataque causa `dano` (+ `dda_base`, `vida`, `dano_nv15`) de `dano_tipo`
#   lamina         Lâmina Arcana: o ataque depois de uma habilidade causa dano extra (recarga 1,5s): `dda_base`, `dda`,
#                  `pdh`, `armadura_bonus`, `vida_max_alvo`; `cura_vida_max_alvo` / `cura_vida_bonus` / `cura_pdh`
#   queimadura     habilidades queimam por `duracao` s: `por_s` + `pdh_por_s` x PdH + `vida_max_alvo_por_s`
#   aura           a cada `a_cada` s em combate, a todos os inimigos: `dano` + `vida_bonus` x Vida adicional +
#                  `vida_max` x Vida máxima; `cura_do_dano`: cura uma fração do dano causado
#   golpe          dano periódico no alvo (recarga `recarga`): `dano` (+ `dano_nv15`), `vida_max` (sua), `vida_max_alvo`,
#                  `pdh`, `dda_bonus`; `gatilho`: ataque | habilidade | qualquer
#   espinhos       ao ser atingido por um ataque devolve `dano` + `armadura_bonus` x Armadura adicional + `vida_bonus` x
#                  Vida adicional de `dano_tipo`
#   feridas        Feridas Dolorosas de `pct` por 3s ao causar dano (`gatilho`: fisico | magico | qualquer) ou ao ser
#                  atingido por ataques (`ao_ser_atingido: true`)
#   corta_escudo   ao causar dano, reduz os escudos do alvo em `base` + `dda_bonus` x DdA adicional (+ `pdh` x PdH),
#                  até `max` (por 3s; os escudos que ele já tem e os que receber)
#   reduz_resistencia  cada acerto (`gatilho`) reduz a `resistencia` (armadura | rm) do alvo em `por_acerto`, até `max`
#                  por `duracao` s
#   amplifica      dano causado a mais: `pct` (+ `pct_por_s` em combate até `max`); `dano_tipo` restringe; `alvo_vida_bonus`
#                  (Lembranças: até `max` com 1.200 de Vida adicional do alvo); `vida_alta`: só acima de 50% de Vida
#   amplifica_alvo inimigos sofrem `pct` a mais (`aura`: todos os inimigos, com `dano_tipo`; `marca`: o alvo de uma
#                  habilidade por `duracao` s)
#   reduz_dano     dano sofrido a menos: `pct` contra `contra` (ataque | critico)
#   critico        Acertos Críticos causam `mult` (200% sem o item)
#   reduz_vel_ataque  inimigos na luta atacam `pct` mais devagar (Coração Congelado; Carapaça do Vigia: ao ser atingido,
#                  contado como sempre ativo)
#   ativo          ativo de dano usado na ordem da build ("Ativo"): `dano` (+ `dano_nv15`), `dda`, `dda_base`, `dda_bonus`,
#                  `pdh`, `vida_max_alvo`; `cura_dda`; `recarga`
