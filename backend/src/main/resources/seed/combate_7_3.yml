# Status da build que só valem depois de um tempo ou de acertos na luta: até lá são descontados (a build conta com eles
# ligados no simulador, mesmo com o condicional da compra / do campeão desligado). Chave: item, runa ou efeito de
# campeão; `passiva` limita às linhas daquela passiva do item. Condições (todas precisam valer):
#   segundos          a partir deste tempo de luta (Duplaguarda: 1 acúmulo por segundo, 5 acúmulos)
#   acertos           ataques / habilidades que o campeão acertou em Campeões
#   acertos_sofridos  habilidades de Campeões que ele sofreu
# Na Arena, quem liga esses efeitos são os gatilhos (abaixo); esta lista só marca o que entra ligado ao medir, no
# planejador, o que cada forma do campeão muda nos status.
ativacao:
  Duplaguarda de Amaranto: {passiva: Tolerância, segundos: 5}
  Força da Natureza: {passiva: Absorção, acertos_sofridos: 4}
  Ritmo Fatal: {acertos: 6}
  Conquistador: {acertos: 6}
  Hemorragia: {acertos: 5, segundos: 3}   # Darius: 5 acúmulos, no mínimo ~3s

# Efeitos das runas na luta. Valores corpo a corpo; `_nv15`: faixa pelo nível do campeão (1–15).
# `adaptativo`: Dano Físico, ou Mágico quando o Poder de Habilidade passa do Dano de Ataque adicional.
#   eletrocutar        `acertos` ataques / habilidades no mesmo Campeão em `janela` s: dano (recarga pelo nível)
#   colheita           dano num Campeão com menos de `vida_alvo` de Vida (recarga)
#   fortalecimento     `ataques` seguidos no mesmo Campeão: dano e `amplifica` de dano até sair de combate (recarga)
#   ritmo_fatal        com os acúmulos no máximo (gatilho da runa ativo), ataques causam dano (+ `por_vel_ataque` por
#                      1% de VdA adicional)
#   aperto             a cada `a_cada` s em combate o próximo ataque num Campeão causa `vida_max` x sua Vida máxima e
#                      cura `cura_vida_max` x Vida máxima (o +10 de Vida permanente é do planejador, por minuto)
#   aery               ataques e habilidades mandam a Aery: dano; ela volta em `retorno` s
#   cometa             habilidade que causa dano lança o cometa: dano depois de `atraso` s (+ `por_acerto` por acerto)
#   primeiro_ataque    dano nos primeiros `janela` s de combate: `pct` de Dano Verdadeiro a mais por `duracao` s
#   suserano           ao imobilizar: explosão de dano em `raio` depois de `atraso` s e Lentidão (gatilho dá as defesas)
#   golpe_desleal      dano em alvo com Lentidão ou imobilizado (recarga)
#   impacto            depois de um avanço ou Flash, o próximo dano em `janela` s soma dano (recarga)
#   ataque_fortalecido a cada `a_cada` s o próximo ataque num Campeão soma dano
#   sequencia          habilidade que causa dano marca: os próximos `golpes` ataques / habilidades somam dano (recarga)
#   tirano             dano num Campeão com menos de `vida_alvo` de Vida soma dano (recarga)
#   zelo               habilidades básicas: +`por_s` de dano por segundo em combate, até `max` acúmulos
#   ate_a_morte        ataques: +`min` a +`max` de dano com a Vida de `vida_de` a `vida_ate`
#   dilacerar          ataques: +`pct` em Campeões acima de `vida_alvo_acima`
#   misericordia       +`pct` em Campeões abaixo de `vida_alvo_abaixo`
#   chamuscar          habilidade que causa dano queima: dano depois de `atraso` s (recarga)
#   arcanista          ultimate: +`pct` de dano
#   transcendencia     a partir do `nivel_min`: habilidade básica que acerta reduz a própria recarga em `pct` (recarga)
#   nimbus             depois de um feitiço: +`pct` de Velocidade de Movimento por `duracao` s
#   revitalizar        curas e escudos em alvos abaixo de `vida_abaixo`: +`pct`
#   hubris             ao abater: +`dda` de Dano de Ataque por `duracao` s
