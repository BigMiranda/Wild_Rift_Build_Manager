# O que é uma "boa build" (Rodada 9, parte 1): a nota de uma build num minuto, pela classe do campeão e pelo arquétipo
# da build. Nenhuma regra cita campeão, item ou runa por nome: a classe vem do perfil (classificacao_7_3d.yml) e o
# arquétipo, do ouro dos status (Rodada 7).
#
# As três partes, todas na mesma escala ("pontos": 0 = como a referência sem itens, 100 = perfeita):
#   defensiva  o índice da Efetividade defensiva (o relatório `relatorio_defensivo`), que já é "quanto da taxa de dano
#              líquida da referência a build cancela";
#   ofensiva   o índice ofensivo (parte 1b) convertido: 100 x (1 - 100 / índice), a parte do tempo para matar da
#              referência que a build economiza (índice 200 = 50 pontos; abaixo de 100, negativo);
#   utilidade  o controle aplicado (s de controle por 10 s de luta, x `utilidade.controle_por_10s`) e a parte do dano
#              do time que a build absorveu nos cenários com aliados (`utilidade.absorvido`), até 100.
#   corrida    (Rodada 15) a corrida das barras de vida: o jogo é sobre a barra inimiga zerar antes da sua, também para
#              tanques. Nas lutas do relatório `corrida` da efetividade (atacantes que morrem), o tempo até cada lado
#              zerar: quando morreu, ou a Vida no fim pelo ritmo em que a perdia nos últimos segundos. Quem segura a Vida
#              no fim (sustain, mesmo perto de zero) nunca zera. Corrida = 100 x meu tempo / (meu + o deles), 50 =
#              empate, 100 = eu não zero e eles sim. Dano, dano devolvido, cura cortada e abates encurtam o deles. Em
#              pontos: quanto da distância da referência até 100 a build fecha.
#   A utilidade (controle aplicado e dano do time absorvido) também vem dessas lutas: nos testes de resistência os
#   atacantes não podem ser alvejados.
#   duelos     opcional: x1 contra os representativos de cada classe (fichas A ou B), com o cérebro automático, no
#              mesmo minuto: 100 x (vida que sobra minha - a do adversário). Desligado por padrão (peso 0): precisa de
#              builds salvas dos adversários e custa uma luta por par.
#
# piso  atiradores, magos e assassinos: abaixo deste valor de defensiva, a nota perde (piso - defensiva) x `piso_peso`.
patch: "7.3d"

relatorio_defensivo: basico
leitura:
  defensiva: fixo        # o comportamento fixo da Rodada 7: a diferença é da build, não da sorte da IA
  ofensiva: largadas     # média de largadas (a ofensiva não tem comportamento fixo)
  largadas: 3

# Rodada 15: a corrida entrou em todas (antes: Tanque 0.70 / 0.20 / 0.10, Lutador 0.45 / 0.45 / 0.10, Atirador, Mago e
# Assassino só ofensiva, Controlador 0.30 / 0.55 / 0.15, Especialista 0.50 / 0.50). Depois, a defensiva (atacantes
# imortais e inalvejáveis) passou a valer menos: muitos itens e passivas só se pagam interagindo com outros campeões,
# o que só a corrida mede.
classes:
  Tanque:       {defensiva: 0.35, utilidade: 0.15, ofensiva: 0.10, corrida: 0.40}
  Lutador:      {defensiva: 0.20, ofensiva: 0.30, utilidade: 0.10, corrida: 0.40}
  Atirador:     {ofensiva: 0.55, corrida: 0.45, piso: 20}
  Mago:         {ofensiva: 0.55, corrida: 0.45, piso: 20}
  Assassino:    {ofensiva: 0.55, corrida: 0.45, piso: 10}
  Controlador:  {defensiva: 0.15, utilidade: 0.50, ofensiva: 0.10, corrida: 0.25}
  Especialista: {defensiva: 0.25, ofensiva: 0.30, corrida: 0.45}
piso_peso: 1.0

# O arquétipo da build no minuto ajusta os pesos (somados aos da classe e normalizados): um lutador com build de tanque
# conta mais a defensiva. Só os arquétipos listados ajustam.
arquetipos:
  tanque:          {defensiva: 0.15, ofensiva: -0.15}
  critico:         {ofensiva: 0.15, defensiva: -0.15}
  letalidade:      {ofensiva: 0.15, defensiva: -0.15}
  mago_explosivo:  {ofensiva: 0.10, defensiva: -0.10}
  suporte:         {utilidade: 0.30, ofensiva: -0.20, defensiva: -0.10}   # Rodada 14: era utilidade +0.20, ofensiva -0.20

utilidade:
  controle_por_10s: 25   # 4 s de controle a cada 10 s de luta = 100 pontos
  absorvido: 1.0         # 1 ponto por % do dano do time absorvido
  # Rodada 14: o que um suporte faz pelo carry, no relatório `suporte` de efetividade_7_3d.yml (a build ao lado de um
  # atirador aliado, com os inimigos indo atrás dele). Só para quem joga de suporte: classe em `classes`, rota em
  # `rotas` ou arquétipo da build em `arquetipos`. Cada parte vai de -100 a 100 contra a referência (o mesmo campeão
  # sem itens), e a leitura é a soma pelos pesos:
  #   carry_vivo     o tempo a mais que o carry vive, sobre o tempo que faltava para o fim da luta na referência
  #   carry_dano     o dano por segundo a mais do carry (ele vivo e sem ser controlado dá mais dano)
  #   controle       os segundos de controle a cada 10 s de luta (lentidão conta), x `controle_por_10s`
  #   dano_cortado   o dano por segundo a menos que os inimigos causaram (escudos e curas não entram aqui: entram no
  #                  carry vivo)
  # `peso_utilidade` soma-se ao peso da utilidade da classe (e a nota se renormaliza): o suporte vale pelo carry.
  # Visão, previsibilidade e o momento de gastar recursos não cabem numa luta: ficam com a partida (estilos de rota).
  suporte:
    relatorio: suporte
    classes: [Controlador]
    rotas: [Suporte]
    arquetipos: [suporte]
    pesos: {carry_vivo: 0.35, carry_dano: 0.25, controle: 0.2, dano_cortado: 0.2}
    peso_utilidade: 0.25

corrida:
  relatorio: corrida      # efetividade_7_3d.yml: atacantes que morrem

duelos:
  peso: 0
  duracao: 45

# Os minutos da nota robusta e o peso de cada um (decrescente: quem morre cedo não chega ao último item).
minutos: [10, 15, 20, fim]
pesos_minuto: [1.0, 0.9, 0.8, 0.7]

# A nota final: a média ponderada entre os cenários e o percentil 20 (os piores cenários pesam).
robustez:
  media: 0.6
  p20: 0.4

# Parte 4b: o começo vale mais. A chance de chegar a um minuto: cada minuto anterior, pela nota dele, numa logística
# (limiar e escala), nunca abaixo do piso; os minutos seguintes valem o peso x essa chance. Uma build que perde cedo
# (nota abaixo do limiar) vale menos no fim, porque talvez nunca chegue lá.
chegar: {limiar: 10, escala: 10, piso: 0.3}

# Versatilidade (escolhas feitas sem saber o que o adversário fará): a parte da média na nota de uma escolha; o resto é
# metade o pior caso e metade o percentil 20 entre as variações (os cenários). Runas pesam versatilidade mais que itens:
# são escolhidas no draft, sem saber as runas do adversário; itens dá para trocar na loja.
versatilidade:
  runas_media: 0.4
  itens_media: 0.8

# Parte 5: novidade em relação às builds conhecidas (as salvas do campeão e as meta cadastradas). Novidade = 1 - Jaccard
# dos itens e da bota até a conhecida mais próxima, mais `fundamental` quando a runa fundamental difere. Uma "descoberta"
# tem nota >= a da melhor conhecida, novidade >= `limiar` e se mantém na confirmação (largadas que a busca não viu),
# com a tolerância abaixo da conhecida confirmada do mesmo jeito.
# Rodada 13: com o objetivo "melhores" (o padrão da Descoberta), as descobertas vêm só do ranking e só quando o campeão
# tem ao menos `minimo_conhecidas` builds conhecidas medidas (com uma só, quase tudo é "novo"); o objetivo "novidade"
# considera também o melhor de cada nicho, sem mínimo, como antes. A novidade nunca entra na nota.
novidade: {limiar: 0.4, fundamental: 0.15, tolerancia_confirmacao: 1.0, minimo_conhecidas: 2}

# Rodada 13: builds de suporte (com o item de suporte, sempre o primeiro). Só para campeões com a rota Suporte ou com uma
# build de suporte salva ou meta; ganham menos ouro (o item dá o ouro das tropas ao aliado): o ritmo é a média das builds
# de suporte salvas do campeão, senão o da build base vezes estas partes. A melhor fica à parte ("Melhor de suporte").
suporte: {ouro: 0.86, xp: 0.9}
