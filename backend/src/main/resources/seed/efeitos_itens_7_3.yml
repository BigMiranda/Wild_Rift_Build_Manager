# Passivas e ativos dos itens que entram no cálculo como "status efetivos" (patch 7.3), além das linhas de `efeitos`
# de loja_7_3.yml (estas ficam no banco, editáveis no Admin, e seguem a escolha "condicional" de cada compra).
#
# Aqui cada efeito tem o próprio liga / desliga na build (vale para todas as compras do item), uma opção e uma taxa por
# minuto, como os efeitos dos campeões:
#   passiva      nome da passiva da loja que o efeito modela (no relatório de ouro efetivo ela deixa de ser estimada
#                pelo tier do item e passa a valer o que dá)
#   condicional  só vale em certas situações (luta, vida baixa, ativo usado): ligado por padrão (padrao: false
#                desliga); linhas sem condicional contam sempre que o item está no inventário
#   opcao        valor escolhido na build (ativações por luta, acúmulos...); valor_por_opcao / ratio_por_opcao x opção
#                (valor_por_opcao_nv15: o valor por ponto no nível 15)
#   por_minuto   cresce sem limite (acúmulos permanentes): a build informa a taxa por minuto, em períodos; cada
#                acúmulo vale as linhas (ratio também: x acúmulos)
#   linhas       tipo (nome do status), valor (+ valor_nv15: faixa pelo nível) ou ratio + ref + escopo (total / bonus
#                / base)
#   nota         premissa da estimativa
#
# Status efetivos (precos_status.yml): não mudam a Vida máxima nem a Aceleração mostradas, têm preço próprio:
#   Escudo / Cura                vida extra temporária numa luta (um acionamento): preço da Vida
#   Escudo / Cura em Aliados     o mesmo dado a aliados (opção "aliados"): preço da Vida
#   Aceleração da Ultimate       soma-se à Aceleração de Habilidade só na ultimate (medido: Ornn nível 15, ult 70s;
#                                10 AH + 10 da ult = 20 AH = 58,3s): 1/4 do preço da AH (1 de 4 habilidades)
#   Aceleração de Hab. Básica    3/4 do preço da AH
#   Estase                       segundos invulnerável em que as recargas correm sem risco: numa luta de ~20s,
#                                1s ≈ 5 de AH
# Valores de Campeões corpo a corpo quando o texto diferencia (os de ataque à distância ficam na nota).
# Efeitos que dependem do inimigo (dano, redução de resistência, Feridas Dolorosas, corte de escudo, redução de dano
# sofrido) ficam para o simulador de confronto.
