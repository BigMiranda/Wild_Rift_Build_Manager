# Patch 7.3f: cópia do 7.3d com as mudanças do 7.3e e do 7.3f tiradas das notas de patch oficiais, não de prints
# (levantamento e fontes em docs/patches/7.3e-7.3f.md). Linhas mudadas por nota levam `fonte_7_3f: nota de patch`
# (as do 7.3c/7.3d seguem com `fonte_7_3d` e as do 7.3a/7.3b com `fonte_7_3b`; histórico em docs/patches/).
# Quando houver prints deste patch, eles prevalecem sobre as notas.
#
# Fichas de habilidades para o confronto orquestrado (arena): geometria, tempos e efeitos de cada habilidade.
#
# Fontes (anotadas em `fontes` de cada habilidade):
#   WR  wiki de League of Legends, páginas do Wild Rift (https://wiki.leagueoflegends.com/en-us/WR:<Campeão>):
#       recargas, conjuração, durações, dano e efeitos. Consultada em 11/10/2026.
#   PC  mesma wiki, páginas do LoL de PC (https://wiki.leagueoflegends.com/en-us/<Campeão>): alcance, largura, raio,
#       velocidade quando a página do Wild Rift não tem (o Wild Rift pode ter valores diferentes: conferir no Treino).
#   EST estimativa, sem fonte (anotada também em `nota`).
# Unidades: distância em unidades do jogo, tempo em segundos, velocidade em unidades/s.
#
# Por campeão: qualidade (A ou B: a ficha serve para a partida inteira), raio (corpo), alcance (ataque básico), espera_ataque (fração do intervalo de ataque antes do golpe sair),
# velocidade_projetil (ataques à distância), efeitos_de_forma (efeitos de campeão de campeoes_7_3d.yml que a arena liga e
# desliga sozinha no momento certo, em vez da escolha da build) e habilidades "1", "2", "3", "R".
#
# Por habilidade:
#   forma         linha (projétil reto) | area (círculo no lançador ou num ponto) | cone | avanco (o lançador avança) |
#                 alvo (precisa de um alvo no alcance) | ataque (fortalece o próximo ataque) | proprio (efeito em si) |
#                 canal (efeito repetido por um tempo, que acompanha o lançador) | campo (área que fica no chão) |
#                 elemental (ultimate do Ornn) | empurrao (Condenar da Vayne) | tudo_ou_nada (ultimate do K'Sante) |
#                 zonas (hitbox real: uma ou várias zonas, veja abaixo)
#   recarga       por rank; conjuracao: tempo parado antes do efeito; atraso: tempo até o efeito depois da conjuração
#   alcance, largura, raio, raio_interno, angulo (graus), velocidade, duracao, intervalo (canal / campo)
#   zonas         lista de zonas, da mais específica para a mais geral: o alvo recebe só a primeira em que está, salvo
#                 `acumula: true`. Cada zona: nome (aparece no cartão da habilidade), forma, dano (mapa ou nome em `danos`),
#                 efeitos. Formas: circulo (raio) | anel (raio_interno, raio) | setor (angulo, raio, raio_interno) |
#                 retangulo (comprimento, largura, centro) | capsula (comprimento, largura, centro: linha de pontas
#                 redondas) | poligono (vertices: [[x, y], ...]) | arco ou corrente (pontos: [[x, y], ...], largura).
#                 Coordenadas relativas: origem em quem lança (ou no ponto mirado), +x para onde mira. O alvo é testado
#                 pelo círculo do corpo dele contra a forma. Num canal ou campo, a primeira zona é a hitbox.
#   origem        lancador (padrão) | ponto (centro no ponto mirado, até `alcance`)
#   no tempo      atraso (detona depois) | expande: {de, em} (cresce de `de` vezes o tamanho até o tamanho cheio em `em` s) |
#                 move: {velocidade, velocidade_final, aceleracao, distancia} (a forma viaja) | segue: true (presa a quem
#                 lançou) | duracao + intervalo (fica no chão e acerta a cada intervalo). Quem move ou cresce acerta cada
#                 alvo uma vez.
#   dano          {tipo: fisico | magico | verdadeiro, base, dda, dda_base, dda_bonus, pdh, vida_max_alvo, vida_bonus,
#                 arm_bonus, rm_bonus, vida_max}; listas são por rank; chave_nv15 = valor no nível 15 (pelo nível)
#   efeitos       aplicados em quem é atingido: lentidao + duracao, atordoa, arremessa (no ar), puxa, fragil, marca,
#                 acumulos (sangramento), reduz_rm / reduz_arm {pct, duracao}, cura_propria, escudo_proprio
#   recursos      furia: ganho / limiar; calor: ganho / zona de perigo / superaquecimento (Renekton, Rumble)
#   imune_deslocamento  num avanço (ou na reconjuração que avança): enquanto o avanço dura, puxões, empurrões e
#                 arremessos no campeão são anulados (só durante o avanço). cc_durante_avanco diz o que um atordoamento
#                 faz nesse tempo: continua_depois (padrão: o avanço segue e o atordoamento cai no fim, com o tempo que
#                 sobrar) ou interrompe (como sem imunidade). Num canal (forma canal), vale pela duração do canal.
#   imparavel     num canal: imune_deslocamento com os atordoamentos anulados (W do Ornn)
#
# Mecânicas que o texto do jogo não diz (por campeão):
#   mobilidade    slot -> avanco | salto | corrida | imune: os avanços próprios que tiram de uma habilidade de mira ou
#                 alcançam o alvo (a IA vê "o alvo tem avanço pronto"; o Flash é contado à parte). Sem o campo, a
#                 arena lê das fichas: forma avanco e alvo com salta.
#   fragil.ataques  o ataque do Ornn num alvo Frágil: efeito empurra (padrão; distância em empurra) ou arremessa
#                 (duracao em s, encadeando com um arremesso em curso pelo maior fim)
# Campos das outras mecânicas (a ficha sintética de cada uma está em backend/src/test/resources/arena/fichas-sinteticas.yml):
#   efeitos       enraiza: s (move não; ataca e lança sim) | silencia: s (move e ataca; não lança) | cega: s (ataques erram) |
#                 provoca: s (anda até quem lançou e o ataca) | amedronta: s (foge de quem lançou) | encanta: s (anda até quem
#                 lançou, sem atacar) | adormece: s (acaba ao sofrer dano) | suprime: s (sem Tenacidade) | polimorfa: s
#                 (sem ataques e habilidades, com lentidao_polimorfo) | afasta: distância, com afasta_velocidade e afasta_parede
#                 (efeitos ao bater na parede) | rouba: {status, valor, duracao} | executa_abaixo: fração da Vida
#   proprio       alvo: proprio | aliado (o de menos Vida, até alcance) | aliados (todos até alcance); escudo, cura (fórmulas);
#                 invisivel: {duracao, revela_dano, revela_proximidade}; invulneravel: s; nao_selecionavel: s; imparavel_por: s
#   forma         piscar (instantâneo até alcance, atravessa parede) | teleporte (canaliza s e aparece no ponto; interrompido por
#                 controle) | invocacao | parede (a primeira zona vira terreno por duracao; perpendicular: atravessada na mira) |
#                 anexar (fica num aliado, sem ser alvo) | volta_no_tempo (segundos: posição e Vida de x s atrás)
#   avanco        ate_ponto: true (vai só até o ponto mirado) | ate_alvo: true (persegue o alvo) | atravessa_parede: true (salto)
#   alcance       global: sem limite no mapa
#   canal         interrompivel: true (controle ou silêncio acabam com o canal, salvo imparavel)
#   carregar      {min, max, alcance_de, alcance_ate, dano_de, dano_ate}: cresce com o tempo segurado (a ordem diz quanto)
#   reconjurar    versoes: [ficha, ficha]: cada reconjuração usa a próxima, com janela e apos
#   formas        por campeão: {nome: {habilidades: {...}, status: {"Attack Damage": 40}}}, com forma_inicial; muda com
#                 troca_forma: nome numa habilidade, ou recurso.forma_acima: {limiar, forma}
#   invoca        na forma invocacao: {nome, comportamento: segue | ataca | parada | explode | mina | clone, vida, dda, armadura, rm,
#                 velocidade, velocidade_ataque, alcance, raio, duracao, quantidade, fracao (clone), raio_disparo, raio_explosao,
#                 arma_em, dano, efeitos, morre_com_dono}; vida e dda podem ser fórmulas do dono
#   recurso       tipo: mana | energia (começa cheio, paga `custo` por rank; max, por_s) | furia | calor | sem_custo. Mana sem `max`
#                 usa o status de Mana Máxima
# Rodada das fichas, lote 1 (docs/fichas/lote-1.md; fichas sintéticas no mesmo arquivo de teste):
#   dano          + vida_perdida_alvo | vida_atual_alvo | vida_bonus_alvo (fração da Vida do alvo) | armazenado (fração do
#                 dano armazenado, veja armazena) | acumulos_permanentes (valor por acúmulo)
#   ao_acertar    {devolve_recarga: fração da recarga restante (uma vez por conjuração), zera_recarga_se: [marca, abate]}: ao
#                 acertar um campeão inimigo (marca = o alvo tinha a marca genérica deste lançador, que é consumida)
#   efeitos       marca: s (a marca genérica; `marca: true` segue sendo a da Vayne / do K'Sante)
#   armazena      por campeão: {causado, sofrido, contra_nao_campeoes (frações), max_vida, decai_apos (s)}; uma habilidade
#                 usa com o termo `armazenado` (escudo ou dano) e zera com consome_armazenado: true
#   acumulos_permanentes  por campeão: {por_minuto, max, desde_min, vida (por acúmulo)}; não simulados: estimados pelo minuto
#                 da build ou o número do cenário (campo "acúmulos" do lutador na Arena)
#   deixa_marco   {nome, em: ponto (padrão, até alcance) | lancador, duracao}: um ponto do lançador no mapa
#   linha_entre   {marco, ate: lancador (padrão) | ponto, largura, dano, efeitos}: a hitbox é o segmento do marco (ou do
#                 lançador, sem marco) até o lançador ou o ponto mirado; o marco é consumido
#   reducao_dano  {pct, duracao}: o lançador sofre menos dano
#   invisivel     + camuflagem: raio de detecção (inimigos a essa distância veem, e a camuflagem continua) | so_em_moita:
#                 true (no mapa inteiro só começa numa moita; a rota única não tem moitas) | fora_da_moita: s (no mapa
#                 inteiro, acaba depois de s fora da moita) | revela_ao_atacar: true | ao_revelar: {velocidade_ataque, duracao}
#   lacunas       por campeão: as mecânicas que o motor ainda não tem, aproximadas (a `nota` diz como)
#
# As fichas passam pelo validador (arena/fight/SheetValidator): campo desconhecido, unidade estranha ou habilidade que não faz nada.
mapa:
  # Rodada 10: o ataque corpo a corpo é um segmento curto do atacante ao alvo, e no Wild Rift acerta as unidades que
  # estão entre os dois (tropas no meio), com o dano cheio (confirmado pelo usuário) e os efeitos de ao acertar dos itens.
  # Vale para todo campeão sem velocidade_projetil; uma ficha pode trocar com o seu próprio `ataque`.
  ataque_corpo_a_corpo: {forma: segmento, largura: 60, acerta_no_caminho: true}
  # regras por tipo de controle: tenacidade (a Tenacidade encurta) e purificar (a Purificar remove)
  controles:
    atordoamento: {tenacidade: true, purificar: true}
    enraizar: {tenacidade: true, purificar: true}
    silencio: {tenacidade: true, purificar: true}
    cegueira: {tenacidade: true, purificar: true}
    provocar: {tenacidade: true, purificar: true}
    medo: {tenacidade: true, purificar: true}
    encanto: {tenacidade: true, purificar: true}
    sono: {tenacidade: true, purificar: true}
    polimorfo: {tenacidade: true, purificar: true}
    supressao: {tenacidade: false, purificar: false}
    arremesso: {tenacidade: false, purificar: false}
  # Howling Abyss simplificado: uma rota reta entre os dois Nexus, com paredes dos dois lados. EST: a wiki não traz as
  # medidas do mapa do Wild Rift; ajuste aqui quando medir.
  comprimento: 10000
  largura: 1100
  nexus_azul: [500, 0]
  nexus_vermelho: [9500, 0]

campeoes:
