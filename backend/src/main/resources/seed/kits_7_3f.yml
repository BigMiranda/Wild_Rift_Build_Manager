      aumento_controle: 0.30                                                 # WR: +30% de duração
      # Rodada 10: o ataque do Ornn num alvo Frágil o LEVANTA (o usuário joga contando com isso) e quebra o Frágil. O
      # arremesso encadeia com um em curso pela regra do airborne (o maior fim). Duração: ESTIMATIVA até o usuário
      # confirmar (a wiki WR: não traz o número), 0,5 s. Antes: {efeito: empurra, empurra: 150}, nunca confirmado.
      ataques: {efeito: arremessa, duracao: 0.5}
    mobilidade: {"3": avanco}
    habilidades:
      "1":
        nome: Ruptura Vulcânica
        forma: linha
        recarga: [9, 8.5, 8, 7.5]
        conjuracao: 0.25
        alcance: 750
        largura: 130
        velocidade: 1800
        atravessa: true
        para_apos_campeao: 200
        dano: {tipo: fisico, base: [25, 60, 95, 130], dda: 1.1}
        efeitos: {lentidao: 0.55, duracao: 2}
        pilar: {atraso: 1.125, duracao: 4, raio: 100}
        fontes: "recarga, conjuração, dano, lentidão, pilar: WR; alcance, largura, velocidade: PC; raio do pilar: EST"
      "2":
