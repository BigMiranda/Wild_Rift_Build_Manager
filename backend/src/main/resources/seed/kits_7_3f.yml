          velocidade: 1250       # PC
          distancia: 1500        # EST: até onde o elemental devolvido corre
          dano: {tipo: magico, base: [125, 175, 225], pdh: 0.2}
          efeitos: {arremessa: 1.0, arremessa_demais: 0.5, fragil: 3}
