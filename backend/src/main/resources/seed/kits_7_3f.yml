        recarga: [90, 80, 70]
        conjuracao: 0.5
        distancia: 2550          # o elemental surge a esta distância, na direção mirada, e corre até o Ornn
        largura: 340
        comprimento: 480         # corpo ao longo do caminho; o meio dele é o ponto que anda (ida e volta)
        velocidade: 450
        velocidade_final: 1250   # acelera até esta velocidade
