      - nome: Bumerangue
        tipos: [Lentidão, Físico]
        recarga: 16
        texto: |-
          Mini-Gnar: arremessa um bumerangue que causa 83 de Dano Físico (5 + 125%{DdA}) e 20% de Lentidão por 2s. O bumerangue volta depois de atingir um inimigo, causando 50% do dano a alvos subsequentes. Cada inimigo pode ser atingido somente uma vez. Apanhar o bumerangue reduz o Tempo de Recarga da habilidade em 40%.
          Mega-Gnar: arremessa um pedregulho que causa 127 de Dano Físico (40 + 140%{DdA}) e 35% de Lentidão ao alvo atingido e aos inimigos próximos por 2s. Apanhar o pedregulho em até 5s reduz o Tempo de Recarga da habilidade em 70%.
          O bumerangue gera 1 de Fúria (aumenta no nível 1/5/10) ao atingir um Campeão e 1 de Fúria (aumenta no nível 1/5/10) ao atingir um não Campeão. Apenas o primeiro acerto em cada alvo gera Fúria.
        niveis:
          Tempo de Recarga: [16, 14, 12, 10]
          Dano de Bumerangue: [5, 55, 105, 155]
          Redução de Velocidade: [20%, 25%, 30%, 35%]
          Dano de Pedregulho: [40, 95, 150, 205]
          Lentidão de Pedregulho: [35%, 40%, 45%, 50%]
