          Passivo: marca Campeões inimigos com menos de 50% de Vida, recebendo 40% de Velocidade de Movimento ao se mover em direção a eles e 60% de Velocidade de Ataque ao enfrentar qualquer inimigo com menos de 50% de Vida. Esses efeitos aumentam para 150% contra alvos com menos de 35% de Vida.
          Ativo: expande brevemente o campo de visão do Warwick, ignorando todos os terrenos, detectando todos os inimigos dentro do alcance no mapa e marcando o Campeão inimigo mais próximo por 8s. Não pode ser utilizado enquanto estiver em combate contra Campeões.
