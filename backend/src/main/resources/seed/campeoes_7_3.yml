          Dano de Hiperativo: [10, 20, 30, 40]
          Vida máxima do alvo: [7%, 9%, 11%, 13%]
          VdA: [35%, 40%, 45%, 50%]
          Dano de Safanão: [45, 85, 125, 165]
      - nome: Pirueta
        tipos: [Físico, Mobilidade]
        recarga: 21
        texto: |-
          Mini-Gnar: salta até um local. Se Gnar aterrissar em uma unidade, ele dará outro salto, indo mais longe na mesma direção. Pular em um inimigo causa 86 de Dano Físico (50 + 6% da própria Vida máxima{Vida}) e 80% de Lentidão por um breve período.
          Mega-Gnar: salta até um local, causando 116 de Dano Físico (80 + 6% da própria Vida máxima{Vida}) a inimigos próximos ao aterrissar. Os inimigos em que Gnar aterrissar diretamente sofrerão 80% de Lentidão por um breve período.
          Se conjurar Pirueta transformar Gnar em Mega-Gnar, o Mega-Gnar também saltará na unidade em que aterrissar, indo ainda mais longe.
