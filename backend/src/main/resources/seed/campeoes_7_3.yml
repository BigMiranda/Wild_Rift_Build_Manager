        tipos: [Mágico]
        recarga: 8
        texto: |-
          Zoe dispara uma estrela que causa dano crescente ao primeiro inimigo atingido de acordo com a distância percorrida, de 48 (45 + 3 + 60%{PdH}) a 120 (112,5 + 7,5 + 150%{PdH}) de Dano Mágico. Inimigos ao redor do alvo sofrem 80% do dano.
          Zoe pode reconjurar a habilidade para redirecionar o projétil para uma nova posição próxima à Campeã.
        niveis:
          Tempo de Recarga: [8, 7.5, 7, 6.5]
