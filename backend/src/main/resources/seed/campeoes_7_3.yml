        tipos: [Fortalecimento]
        recarga: 20
        texto: |-
          Mini-Gnar (Passivo): todo terceiro ataque ou habilidade contra o mesmo inimigo causa mais 10 (10 + 100%{PdH}) mais 7% da Vida máxima do alvo como Dano Mágico e concede 20% de Velocidade de Movimento (com base no nível de GNAR!) que decai ao longo de 3s.
          Mini-Gnar (Ativo): recebe 35% de Velocidade de Ataque por 6s.
          Mega-Gnar: golpeia a área à frente, causando 107 de Dano Físico (45 + 100%{DdA}) em área e Atordoando por 1,25s.
          Recebe a Velocidade de Movimento adicional passiva de Hiperativo ao deixar a forma de Mega-Gnar.
          Mini-Gnar (Passivo) causa até 300 de dano contra monstros.
        niveis:
