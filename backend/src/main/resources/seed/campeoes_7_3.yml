        tipos: [Mágico, Fortalecimento]
        recarga: 0.3
        texto: |-
          Passivo: os inimigos derrubam fragmentos de feitiço quando conjuram um feitiço ou usam um item ativo. Tropas específicas também deixam cair um fragmento de feitiço quando são abatidas por Zoe ou um aliado próximo. Zoe pode recolher o fragmento para conjurar a habilidade correspondente uma vez.
          Passivo: quando Zoe conjura esta habilidade ou qualquer feitiço, ela recebe 25%{VdM} por 2s e dispara 3 projéteis no último alvo que ela tiver atacado. Cada projétil causa 25 de Dano Mágico (25 + 15%{PdH}).
          Ativo: conjura a habilidade de um fragmento de feitiço que ela tiver recolhido.
          Os fragmentos de feitiço ficam no chão por 20s.
          Cada projétil pode aplicar "Brililim!".
        niveis:
          VdM: [25%, 30%, 35%, 40%]
          Dano base: [25, 35, 45, 55]
