    passiva:
      nome: Jardim de Espinhos
      tipos: [Passivo, Mágico]
      texto: |-
        Um Cospe-Espinhos com 30 de Vida (30 + 22%{PdH}) brota assim que Pântano das Raízes atinge um Campeão inimigo. Se nenhum Campeão inimigo for atingido, um Cospe-Espinhos brotará quando Pântano das Raízes terminar.
        O Cospe-Espinhos atacará alvos automaticamente dentro de 6s após brotar, causando 10 de Dano Mágico (10 + 10%{PdH}).
        Um Cospe-Espinhos adicional brota sempre que Farpas Mortais ou Espinhos Sufocantes atingem um Campeão inimigo, monstro grande ou monstro épico.
        Cospe-Espinhos causam 23 de dano adicional contra monstros ({nível}).
        Cospe-Espinhos que brotarem após o primeiro causarão 50% de dano contra o mesmo alvo.
        As habilidades dos Campeões inimigos causam 35% de dano aos Cospe-Espinhos.
        Monstros não épicos causam 35% de dano aos Cospe-Espinhos.
    habilidades:
      - nome: Farpas Mortais
        tipos: [Mágico]
        recarga: 8
        texto: |-
          Vinhas se espalham e explodem em farpas, causando 60 de Dano Mágico (60 + 60% do {PdH}) e fazendo brotar 1 Cospe-Espinhos.
        niveis:
          Tempo de Recarga: [8, 7.5, 7, 6.5]
          Dano base: [60, 115, 170, 225]
      - nome: Crescimento Desenfreado
        tipos: [Fortalecimento]
        recarga: 18
        texto: |-
          Cospe-Espinhos próximos ficam enfurecidos, redefinindo a própria duração e recebendo 35% de Vida adicional, além de 50% de Velocidade de Ataque.
        niveis:
          Tempo de Recarga: [18, 16, 14, 12]
          Vida: [35%, 40%, 45%, 50%]
      - nome: Pântano das Raízes
        tipos: [Controle, Mágico]
        recarga: 12
        texto: |-
          Zyra lança vinhas imobilizadoras à frente, Enraizando os inimigos atingidos por 1s e causando 60 de Dano Mágico (60 + 40%{PdH}).
          Um Cospe-Espinhos surge assim que a habilidade termina ou quando atinge um Campeão inimigo pela primeira vez (monstros grandes e épicos são tratados como Campeões).
        niveis:
          Dano base: [60, 100, 140, 180]
          Duração de Enraizamento: [1, 1.25, 1.5, 1.75]
      - nome: Espinhos Sufocantes
        tipos: [Mágico, Controle]
        recarga: 80
        texto: |-
          Invoca a fúria da natureza e faz surgir uma grande raiz retorcida, causando 150 de Dano Mágico (150 + 50%{PdH}) em um local-alvo. Depois de 2s, a raiz rebate para cima, Arremessando ao Ar os inimigos atingidos por 1s.
          Um Cospe-Espinhos adicional surge para cada Campeão inimigo, monstro grande ou monstro épico atingido.
        niveis:
          Tempo de Recarga: [80, 70, 60]
          Dano base: [150, 225, 300]
