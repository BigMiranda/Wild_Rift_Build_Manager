    status:
      recurso: Mana
      VdM: 360
      nv1: {DdA: 54, PdH: 0, Vida: 600, Mana: 420, Armadura: 37, RM: 36, VdA: 0.75, AH: 0, RegVida: 6, RegMana: 14}
