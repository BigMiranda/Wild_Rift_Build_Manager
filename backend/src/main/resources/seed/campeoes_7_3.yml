          Coloca uma runa temporal de proteção que dura 5s em si mesmo ou em um Campeão aliado. Se o portador da runa sofrer dano letal nesse período, ele saltará de volta no tempo e ficará inalvejável por 3s antes de ressuscitar e ser curado em 600 de Vida (600 + 200%{PdH}).
          Se o portador da runa não acionar o efeito de ressurreição da runa, 10% do Tempo de Recarga de Alteração Temporal será restituído.
          O alvo se torna inalvejável e invulnerável durante a ressurreição, mas não pode realizar nenhuma ação.
        niveis:
          Tempo de Recarga: [110, 95, 80]
          Custo: [125, 150, 175]
          Cura: [600, 850, 1100]
