      tipos: [Passivo, Fortalecimento]
      texto: |-
        Causar ou sofrer dano gera Fúria. Com o máximo de Fúria, as habilidades de Gnar se transformarão e sua próxima habilidade o transformará em Mega-Gnar por 15s.
        Mini-Gnar: recebe 0 de Velocidade de Movimento (máximo: 20) ({nível}), 0 de Alcance de Ataque (máximo: 150) ({nível}) e 0% de Velocidade de Ataque (máximo: 90%) ({nível}).
        Mega-Gnar: recebe 100 de Vida base (máximo: 900) ({nível}), 5 de Armadura base (máximo: 60) ({nível}), 5 de Resistência Mágica base (máximo: 70) ({nível}), e 8 de Dano de Ataque base (máximo: 50) ({nível}).
        Ao causar ou sofrer dano como Mini-Gnar, recebe 3 de Fúria (aumenta nos níveis 1/5/10) pelos próximos 2s. Atacar Campeões inimigos gera 2 de Fúria, e atacar não Campeões gera 1 de Fúria (aumenta nos níveis 1/5/10).
        Com o máximo de Fúria, Gnar se transformará automaticamente depois de 4s caso não use nenhuma habilidade.
        A Fúria começará a diminuir depois de 13s se Gnar ficar sem causar ou sofrer dano.
        Gnar não poderá gerar Fúria por 15s depois de se transformar em Mini-Gnar ou Mega-Gnar.
        Mini-Gnar e Mega-Gnar compartilham o Tempo de Recarga de todas as habilidades, com exceção de Hiperativo.
