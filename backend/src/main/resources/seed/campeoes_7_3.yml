# Campeões do Wild Rift, patch 7.3 (pt-BR): passiva e habilidades transcritas da Coleção > Campeões do jogo em
# 09/10/2026 (painel de cada habilidade nos modos texto "T" e tabela por nível "≡").
#
# Por campeão: titulo, passiva {nome, tipos, texto} e habilidades (1, 2, 3 e ultimate, na ordem do jogo), cada uma com
# nome, tipos (as etiquetas entre colchetes), recarga (s, a do nível 1, quando o painel mostra), texto e niveis (a
# tabela "≡": rótulo -> um valor por nível da habilidade; decimais com ponto; rótulo repetido na mesma tabela ganha
# " (2)", " (3)"...).
#
# O texto mostra os valores do nível 1 da habilidade e do campeão. Os ícones de escala no texto viram marcadores:
#   {DdA}    garra laranja: Dano de Ataque
#   {PdH}    pena roxa: Poder de Habilidade
#   {Arm}    escudo amarelo: Armadura
#   {RM}     círculo azul: Resistência Mágica
#   {Vida}   coração verde: Vida
#   {Mana}   gota azul: Mana
#   {VdM}    seta alada branca: Velocidade de Movimento
#   {Crit}   garra vermelha: Taxa de Acerto Crítico
#   {VdA}    ícone de Velocidade de Ataque
#   {Let}    escudo vermelho: Letalidade
#   {Vamp}   ícone de Vampirismo Físico
#   {Trein}  ícone de acúmulos de Treinamento Dracônico (Smolder)
#   {nível}  losango branco: escala com o nível do campeão
# forma_alternativa: habilidades que a Coleção não mostra (Jayce, Nidalee), complementadas da wiki oficial.
#
# status: lido no modo Treino (placar > 3ª aba) em 10/10/2026, sem itens, com "Atualizar estado" (vida cheia):
#   nv1 / nv15: valores no nível 1 e no nível 15 (Redefinir nível / Subir de nível). Vida e Mana são os máximos;
#     VdA em ataques/s; Crit, Tenacidade, Vamp*, Pen*% em %; só aparecem os status extras diferentes de zero
#     (passivas como a Taxa de Crítico do Tryndamere ou o Vampirismo do Nasus).
#   VdM: medida fora da base (na fonte o jogo soma um bônus grande); não muda com o nível, salvo passivas (Rammus).
#   recurso: Mana, Energia, Fúria...; "máx." quando a barra tem um máximo fixo (Mana cresce por nível, fica em nv*).
#   A página de runas padrão de cada campeão altera o painel; o efeito destas foi descontado (comentário no bloco):
#     Transcendência (+5 AH no nível 1, +10 no 15), Foco Absoluto (+4/+40 PdH ou +2/+20 DdA com vida alta),
#     Perseverança (+10% Tenacidade), Lenda: Linhagem (+1% Vampirismo Universal) e Lenda: Espontaneidade (+3% de VdA;
#     a base é estimada como VdA / 1,03, ±0,01). As demais estavam zeradas (dependem de abates, acúmulos ou tempo).
#   Nenhuma habilidade estava aprendida na medição (o Treino deixa os pontos livres), então os passivos de habilidade
#   não estão nos valores. Gnar (Mega-Gnar) e Jayce (Martelo) foram medidos na forma alternativa: a base ficou a da
#   forma padrão, conferida no jogo, e a outra forma virou um efeito.
#
# efeitos: o que muda status e entra no cálculo (o resto da passiva e das habilidades fica só como texto). Por grupo
# (passiva ou habilidade):
#   habilidade   P (passiva: desde o nível 1) ou 1, 2, 3, R: só conta com a habilidade aprendida, e listas de valores
#                são por rank. Os ranks seguem a ordem de habilidades da build: níveis 1-3 aprendem as três básicas,
#                a ultimate sobe nos níveis 5, 9 e 13 (conferido no jogo) e os demais pontos vão para a básica de maior
#                prioridade que ainda não está no máximo (4 ranks).
#   condicional  efeito que só vale em certas situações (forma, ativo, acúmulos...): ligado ou desligado por build,
#                desligado por padrão (padrao: true = ligado). Linhas com `condicional` dependem da mesma chave.
#   opcao        valor escolhido por build (Vida perdida, acúmulos...); valor_por_opcao é somado x opcao.
#   por_minuto   cresce sem limite (almas, acúmulos, abates): a build informa a taxa por minuto, em períodos, como
#                nas runas; cada acúmulo vale `valor` (por rank, se lista).
#   linhas       como nos itens: tipo (nome do status na loja), valor (e valor_nv15: faixa pelo nível do campeão), ou
#                ratio + ref + escopo (total / bonus / base). ref_pre: a conversão lê só o adicional fixo da origem
#                (itens e runas), antes de multiplicadores (Vladimir, Pyke). ratio negativo = perde (K'Sante).
#   Conferidos no jogo em 10/10/2026: Trovoada do Malphite (+25% da Armadura total), Presença Inabalável da Poppy
#   (+12% da Armadura e da RM totais), Bola Curva Defensiva do Rammus ((Armadura + 30) x 1,3; (RM + 10) x 1,35).
#   Valores "({nível})" sem o máximo na Coleção usam o valor do nível 1 (anotado em `nota`).
#   Escudos e curas da passiva entram como status efetivos (Escudo, Cura, Cura em Aliados: vida extra temporária numa
#   luta, ver efeitos_itens_7_3.yml), um acionamento por luta salvo a opção; ligados por padrão (padrao: true). Vampirismo, alcance,
#   penetração sobre armadura adicional e efeitos de poucos segundos de Velocidade de Movimento ficam só no texto.
