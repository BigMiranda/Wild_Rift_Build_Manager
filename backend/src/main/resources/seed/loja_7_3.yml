# Catálogo transcrito das capturas da loja do Wild Rift (pt-BR), patch 7.3.
# Fonte: capturas/7.3 (prints do jogo). Transcrição feita por IA e revisada pelo usuário.
#
# Por item:
#   custo       custo total na loja (dos prints "Aba ... Resumos")
#   secao       aprimorado | tier_medio | basico | preparacao   (como a loja agrupa; botas usam as mesmas seções)
#   ativavel    true quando o ícone tem o losango de item ativável
#   marcador    selo da loja (mudança no patch): novo (N) | reformulado (setas azuis) | alterado (seta vermelha)
#   abas        abas da loja onde o item aparece
#   resumo      texto curto da lista de resumos
#   status      [{tipo, valor}]       status planos, como escritos na loja ('% ' no início = valor percentual)
#   passivas    [{nome, texto}]       texto das passivas/ativos, como escrito na loja
#   receita     componentes diretos (árvore de construção, um nível); {item, qtd} quando repetido
#   fabrica     nomes dos itens em que este se transforma ("Fabrica:")
#   captura     arquivo de origem do detalhe
#   evolucao    item em que este se transforma sozinho (missão / carga de mana), com seus status
#   efeitos     modelagem numérica das passivas que mexem em status (o resto das passivas é só texto):
#                 {passiva, tipo, ratio, ref, escopo: total|bonus|base, condicional}  -> ratio x status 'ref'
#                 {passiva, tipo, valor, valor_nv15, condicional}                     -> valor fixo (interpolado nv1..15)
#               condicional = só vale em certas situações (acúmulos, combate, vida baixa); o cálculo deixa ligar/desligar.
#   revisar     dúvidas que só o usuário pode resolver (o resto foi conferido cruzando árvores e listas "Fabrica")
