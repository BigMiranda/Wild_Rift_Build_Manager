# Atlas de interações (Rodada 16, docs/rodada-16.md): as condições (status, passivas de itens, runas fundamentais,
# runas, feitiços) medidas sozinhas, em pares e em trios, numa luta fechada entre dois campeões. A medida é a corrida das
# barras de vida (Rodada 15), na visão do lado A: 50 = empate.
#
# Uma execução tem o seu contexto fixado: os dois campeões (`a`, `b`, códigos de unidade), o modo (só x1 por enquanto) e
# os minutos. A base de cada lado é a build padrão da última campanha do campeão (runas, feitiço, ordem de habilidades e
# o ritmo que dá o nível no minuto), sem itens: as condições entram por cima, e as runas e o feitiço por troca.
#
# Condições (AtlasCatalog), todas lidas dos seeds:
#   status       cada status que os itens finais e as botas dão fixo, em dois níveis: o que um item dá (a mediana) e o
#                dobro
#   passiva      cada item final ou bota com passiva, ativo ou efeito de luta, sem os status fixos dele
#   fundamental  cada runa fundamental diferente da base
#   runa         cada runa que a base não tem: na linha dela da árvore principal, ou na vaga secundária
#   feitico      cada feitiço que a base não tem, no lugar do que não é o Flash
# Capacidades que a Arena ainda não modela (invisibilidade, revelar...) ficam de fora até serem configuradas.
#
# Campos (cada execução pode trocar qualquer um do `padrao`):
#   minutos      os minutos medidos (cada um é uma medição inteira)
#   dimensoes    1, 2, 3: sozinhas, pares e trios
#   duracao      segundos de cada luta
#   largadas     lutas por medida, de distâncias e posições diferentes (a média). Uma luta fechada é sensível: um
#                pouco mais de velocidade ou aceleração muda as decisões da IA. Com 1 e 3 largadas, as notas sozinhas
#                se correlacionaram 0,69 no piloto; as lutas custam pouco (o que custa é preparar cada lutador)
#   top_2d       pares só entre as N condições mais relevantes de cada lado pela nota sozinha (0 = todos os pares)
#   top_3d       trios entre as N mais relevantes de cada lado (pela nota e pelos pares)
#   validacao    conjuntos sorteados, nunca medidos, para conferir a previsão de 1, 2 e 3 dimensões
#   builds_inteiras  builds de verdade (itens reais nos dois lados, às vezes uma runa fundamental, uma runa ou um
#                feitiço trocados), metade sorteada da loja toda e metade entre os melhores itens do guia vazio. Sobre
#                elas se ajusta o modelo de builds inteiras (Rodada 16, parte 2): as notas, os pares e os trios em
#                chances, com um coeficiente por ordem e uma correção por condição, escolhida por validação cruzada
#   refino_rodadas, refino_builds  rodadas de refino depois delas: o guia monta as duas builds uma contra a outra (sem
#                nada fixado e a partir de primeiros itens sorteados), mais vizinhas (um item trocado, sem a página de
#                runas); o modelo as prevê antes de vê-las (o erro e o viés ficam guardados), elas são lutadas e o modelo
#                é ajustado de novo. O guia escolhe o que o modelo superestima; o refino ensina o modelo justamente aí
#   fontes       quais condições entram
#   cerebro      (Rodada 19) quem decide na luta: tactical_stand (a "troca parada": as regras táticas sem fugir, o de
#                antes e o de quem não tem o campo), tactical (o Tático, com fuga) ou auto (o Automático: a IA do campeão
#                ou a da classe, escolhida uma vez por lado e minuto, nas duas bases frente a frente)
#   modo_guia    (Rodada 19) o que o guia lê por padrão: progressao (contra a progressão natural do outro lado) ou
#                fixado (contra o que o outro lado fixou, como antes; o das execuções sem o campo)
#   minutos_progressao  os minutos em que a progressão natural do outro lado é sorteada (cada um lido no minuto medido
#                mais perto). O que o outro lado fixou é o começo da cadeia de compras
#   amostras_progressao builds sorteadas por minuto
#   peso_media, percentil_baixo  a nota de uma build: peso_media x a média + o resto x a robustez, que é a média do pior
#                caso e do percentil baixo (como a versatilidade das runas)
#   aviso_ramo   uma escolha que só rende contra menos do que essa parte das builds sorteadas ganha um aviso
#   objetivo     (Rodada 19, parte 4) papel: o objetivo de cada lado sai da classe dele (objetivo_por_classe abaixo):
#                o duelo e, para quem tem peso de equipe, uma luta pequena com um carry aliado; duelo: só o 1x1 (o de
#                antes e o das execuções sem o campo)
#   largadas_equipe  largadas de cada luta de equipe (menos que as do duelo: é o custo a mais de cada medida)
patch: "7.3d"

padrao:
  modo: x1
  # Rodada 19: 10, 15 e 20 passariam de 1 h (o minuto 15 sozinho, com tudo, leva mais de 1 h: docs/rodada-19.md, parte 5)
  minutos: [15, 20]
  dimensoes: [1, 2, 3]
  duracao: 60
  largadas: 6
  top_2d: 0
  top_3d: 12
  validacao: 150
  builds_inteiras: 600
  refino_rodadas: 3
  refino_builds: 120
  fontes: [status, passiva, fundamental, runa, feitico]
  semente: 1
  cerebro: auto
  objetivo: papel
  largadas_equipe: 3
  modo_guia: progressao
  minutos_progressao: [10, 15, 20, 25]
  amostras_progressao: 12
  peso_media: 0.4
  percentil_baixo: 0.2
  aviso_ramo: 0.3

execucoes:
  ornn_rumble:
    nome: "Ornn × Rumble (piloto)"
    a: ORNN
    b: RUMBLE
  # Rodada 19: só as condições sozinhas e as builds inteiras (o modelo do guia), nos minutos 10, 15 e 20: ~18 min.
  ornn_rumble_rapido:
    nome: "Ornn × Rumble (rápido: 1 dimensão e builds)"
    a: ORNN
    b: RUMBLE
    minutos: [10, 15, 20]
    dimensoes: [1]
    validacao: 0

# Objetivo por classe (Rodada 19, parte 4): o peso do duelo 1x1 e o da luta de equipe na nota de cada lado. A chave é
# "Classe/Subclasse" (como em campeoes_<patch>.yml) ou a classe; vale a primeira que existir. Sem chave: só o duelo.
#   Lutadores e assassinos: o duelo pesa mais. Tanques e controladores: além do duelo, a luta de equipe, que mede o que
#   eles fazem por um carry aliado.
objetivo_por_classe:
  Tanque: {duelo: 0.35, equipe: 0.65}
  Controlador: {duelo: 0.35, equipe: 0.65}
  Lutador: {duelo: 0.8, equipe: 0.2}
  Assassino: {duelo: 0.9, equipe: 0.1}
  Mago: {duelo: 1.0}
  Atirador: {duelo: 1.0}
  Especialista: {duelo: 1.0}

# A luta de equipe: o lado com peso de equipe e o aliado de um cenário de efetividade (o carry do grupo `suporte` da
# Rodada 14, crescendo com o minuto, mortal) atrás dele; o campeão do outro lado mergulha no carry. A medida é a corrida
# das barras do carry e do mergulhador: quanto o lado faz o carry viver (controle aplicado, dano absorvido, dano inimigo
# cortado, matar o mergulhador) entra nela.
equipe:
  cenario: mergulho_no_carry
  aliado: 0

# "Aproveita o kit?" (Rodada 19, parte 4): para cada status, quanto o kit do campeão o converte em efeito (0 a 1).
#   dependencia_ataque  a dependência de ataques básicos de cada classe; misturada (peso_classe) com a parte do dano por
#                segundo dos ataques básicos no perfil do campeão (ChampionProfiles)
#   status       como cada status se converte: ataque (a dependência), critico (a dependência; sem nenhuma menção a
#                crítico nas habilidades, vezes critico_sem_texto), vel_ataque (a dependência vezes velocidade_ataque),
#                razao (1 se alguma habilidade escala com ele; o Dano de Ataque, senão, a dependência), fisico / magico
#                (a parte do dano daquele tipo), mana (1 se o campeão usa mana). Status fora da lista: 1 (vida,
#                resistências, velocidade, aceleração... todo kit converte)
#   Um item (ou passiva) vale a média dos status dele, pelo ouro. Abaixo do limiar, a condição é "fora do arquétipo":
#   não é proibida, mas só entra na build montada se vencer as do kit por `margem` pontos na nota (objetivo do papel e
#   robustez), e aparece marcada como descoberta a conferir.
aproveita_kit:
  limiar: 0.4
  margem: 3
  peso_classe: 0.6
  critico_sem_texto: 0.6
  velocidade_ataque: 0.8
  dependencia_ataque:
    Atirador: 1.0
    Lutador: 0.6
    Assassino: 0.6
    Especialista: 0.4
    Tanque: 0.3
    Controlador: 0.2
    Mago: 0.15
  status:
    "Attack Damage": razao
    "Ability Power": razao
    "% Critical Rate": critico
    "% Attack Speed": vel_ataque
    "% Lifesteal": ataque
    "Armor Penetration": fisico
    "% Armor Penetration": fisico
    "Magic Penetration": magico
    "% Magic Penetration": magico
    "Max Mana": mana
    "% Mana Regeneration": mana

# Arquétipo pedido (no guia contra a progressão natural, como o seletor da Descoberta): a build montada de um lado é
# puxada para o arquétipo escolhido (classificacao_<patch>.yml: a parte do ouro de cada família de status e os efeitos).
# A nota de cada passo perde `penalidade` pontos por unidade de distância ao arquétipo (o que falta em cada condição da
# regra dele, como parte do limiar, mais o quanto a build está dentro de uma regra que vem antes e ganharia). Com um
# arquétipo pedido, a regra do "aproveita o kit?" não vale para aquele lado (quem pediu escolheu). O outro lado sorteia a
# progressão natural puxada para o arquétipo pedido para ele.
arquetipo_alvo:
  penalidade: 25
