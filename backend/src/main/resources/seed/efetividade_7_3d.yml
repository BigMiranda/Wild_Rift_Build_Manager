  # ---------------------------------------------------------------- suporte (Rodada 14)
  # A build ao lado de um atirador aliado (o carry). `alvo_aliado: 0` faz o atacante ir atrás do primeiro aliado, não
  # da build. Medem o que um suporte faz pelo carry (BuildScore, `utilidade.suporte` em nota_builds_7_3d.yml): quanto
  # tempo a mais ele vive, quanto dano a mais consegue dar, o controle aplicado nos inimigos e o dano inimigo cortado,
  # cada um contra a referência (o mesmo campeão sem itens).
  mergulho_no_carry:
    nome: Mergulho no carry
    grupo: suporte
    duracao: 60
    nota: 'Um assassino e um lutador mergulham no atirador aliado da build, não nela. Mede o que a build faz pelo carry: quanto tempo a mais ele vive e quanto dano consegue dar.'
    atacantes:
    - {nome: Assassino, funcao: assassino, vida: 6000, armadura: 50, rm: 50, dda: 230, velocidade_ataque: 1.1,
       status: {Armor Penetration: 18}, alvo_aliado: 0,
       pulsos: [{nome: Explosão de assassino, tipo: dano, dano_tipo: fisico, base: 260, dda: 1.0, a_cada: 7, alcance: 400}]}
    - {nome: Lutador, funcao: lutador, vida: 7500, armadura: 80, rm: 60, dda: 200, velocidade_ataque: 1.0,
       itens: [Hemodrenário], alvo_aliado: 0,
       pulsos: [{nome: Mergulho, tipo: dano, dano_tipo: fisico, base: 180, dda: 0.8, a_cada: 8, alcance: 450,
                 controle: arremesso, duracao: 0.75}]}
    aliados:
    - {nome: Atirador aliado, funcao: atirador, vida: 3800, armadura: 45, rm: 40, dda: 230, velocidade_ataque: 1.3,
       status: {"% Critical Rate": 50}}
  cutucada_no_carry:
    nome: Carry cutucado de longe
    grupo: suporte
    duracao: 60
    nota: Um mago de artilharia e um atirador batem de longe no atirador aliado. Mede a proteção que a build dá a ele.
    atacantes:
    - {nome: Mago de artilharia, funcao: mago, vida: 6000, armadura: 50, rm: 50, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 500}, alcance: 600, alvo_aliado: 0,
       pulsos: [{nome: Disparo de longe, tipo: dano, dano_tipo: magico, base: 200, pdh: 0.5, a_cada: 4, alcance: 1100}]}
