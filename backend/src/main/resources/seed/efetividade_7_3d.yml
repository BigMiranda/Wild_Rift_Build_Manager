       status: {"% Critical Rate": 25, "% Armor Penetration": 20}}
  tres_atiradores:
    nome: Três atiradores
    grupo: ameaca
    ameaca: [Atirador]
    quantos: 3
    duracao: 120
    nota: 'Três atiradores de ataques básicos: muitos golpes por segundo, o que favorece Armadura e o que reduz velocidade de ataque.'
    atacantes:
    - {nome: Atirador, funcao: atirador, vida: 6000, armadura: 50, rm: 50, dda: 260, velocidade_ataque: 1.5,
       status: {"% Critical Rate": 50}, itens: [Sedenta por Sangue]}
    - {nome: Atirador 2, funcao: atirador, vida: 6000, armadura: 50, rm: 50, dda: 240, velocidade_ataque: 1.6,
       status: {"% Critical Rate": 25, "% Armor Penetration": 20}}
    - {nome: Atirador 3, funcao: atirador, vida: 6000, armadura: 50, rm: 50, dda: 220, velocidade_ataque: 1.7,
       status: {"% Critical Rate": 25}}
  encantadores:
