    - {nome: Lutador de flanco, funcao: lutador, vida: 5500, armadura: 80, rm: 60, dda: 180, velocidade_ataque: 0.9}

  # ---------------------------------------------------------------- ameaças (Rodada 14)
  # Times inimigos que imitam uma subclasse de campeão (a da wiki ou a lida do perfil, classificacao_7_3d.yml). `ameaca`
  # diz quais subclasses o cenário imita e `quantos`, quantos campeões delas o time inimigo precisa ter para o guia
  # automático usar a build que melhor se sai nele. Os pulsos com `controle` (atordoamento | arremesso | lentidao, por
  # `duracao` s) imitam o engajamento dos tanques e dos captores; `tipo: controle` só controla, sem dano.
  assassinos_proximidade:
    nome: Assassinos de proximidade
    grupo: ameaca
    ameaca: [Assassino, Escaramuçador]
    quantos: 2
    duracao: 120
    nota: Dois assassinos que chegam perto e explodem (letalidade), com uma lentidão no avanço. Armadura e Vida logo de início seguram a explosão.
    atacantes:
    - {nome: Assassino de explosão, funcao: assassino, vida: 6000, armadura: 50, rm: 50, dda: 250, velocidade_ataque: 1.1,
       status: {Armor Penetration: 25},
       pulsos: [{nome: Explosão de assassino, tipo: dano, dano_tipo: fisico, base: 320, dda: 1.2, a_cada: 7, alcance: 400,
                 controle: lentidao, lentidao: 0.4, duracao: 1.5}]}
    - {nome: Escaramuçador, funcao: assassino, vida: 6500, armadura: 60, rm: 50, dda: 230, velocidade_ataque: 1.3,
       status: {Armor Penetration: 15, "% Omnivamp": 8},
       pulsos: [{nome: Golpe de escaramuça, tipo: dano, dano_tipo: fisico, base: 180, dda: 0.9, a_cada: 4, alcance: 300}]}
  colossos:
    nome: Colossos
    grupo: ameaca
    ameaca: [Colosso, Mergulhador]
    quantos: 2
    duracao: 120
    nota: Dois lutadores de muita Vida e dano contínuo de perto, que se curam (Hemodrenário e uma cura própria). O corta-cura e o dano devolvido pesam na corrida.
    atacantes:
    - {nome: Colosso, funcao: lutador, vida: 9000, armadura: 90, rm: 70, dda: 200, velocidade_ataque: 1.0,
       status: {"% Armor Penetration": 15}, itens: [Hemodrenário],
       pulsos: [{nome: Golpe de colosso, tipo: dano, dano_tipo: fisico, base: 160, dda: 0.9, a_cada: 5, alcance: 300},
                {nome: Fôlego de colosso, tipo: cura, base: 250, a_cada: 8, alcance: 100}]}
    - {nome: Mergulhador, funcao: lutador, vida: 7500, armadura: 80, rm: 60, dda: 210, velocidade_ataque: 1.1,
       itens: [Hemodrenário],
       pulsos: [{nome: Mergulho, tipo: dano, dano_tipo: fisico, base: 200, dda: 0.8, a_cada: 8, alcance: 450,
                 controle: arremesso, duracao: 0.75}]}
  tanques_iniciacao:
    nome: Tanques de iniciação
    grupo: ameaca
    ameaca: [Vanguarda, Guardião]
    quantos: 1
    duracao: 120
    nota: Um tanque que engaja com controle encadeado (arremesso e atordoamento) e um atirador e um mago que aproveitam a janela.
    atacantes:
    - {nome: Tanque de iniciação, funcao: tanque, vida: 9000, armadura: 120, rm: 90, dda: 100, velocidade_ataque: 0.7,
       status: {Ability Power: 100},
       pulsos: [{nome: Engajamento, tipo: dano, dano_tipo: magico, base: 200, pdh: 0.5, a_cada: 10, alcance: 450,
                 controle: arremesso, duracao: 1.0},
                {nome: Controle encadeado, tipo: controle, a_cada: 12, alcance: 350, controle: atordoamento, duracao: 1.5}]}
    - {nome: Atirador, funcao: atirador, vida: 6000, armadura: 50, rm: 50, dda: 280, velocidade_ataque: 1.4,
       status: {"% Critical Rate": 50}}
    - {nome: Mago, funcao: mago, vida: 6000, armadura: 50, rm: 50, dda: 60, velocidade_ataque: 0.7,
       status: {Ability Power: 550}}
  captores:
    nome: Captores
    grupo: ameaca
    ameaca: [Captor]
    quantos: 1
    duracao: 120
    nota: Um captor que prende de longe (atordoamento) e um assassino que chega em quem foi preso.
    atacantes:
    - {nome: Captor, funcao: suporte, vida: 6500, armadura: 70, rm: 60, dda: 60, velocidade_ataque: 0.7,
       status: {Ability Power: 250},
       pulsos: [{nome: Captura, tipo: dano, dano_tipo: magico, base: 220, pdh: 0.6, a_cada: 10, alcance: 900,
                 controle: atordoamento, duracao: 1.75}]}
    - {nome: Assassino, funcao: assassino, vida: 6000, armadura: 50, rm: 50, dda: 260, velocidade_ataque: 1.1,
       status: {Armor Penetration: 20}}
  artilharia:
    nome: Magos de artilharia
    grupo: ameaca
    ameaca: [Artilharia]
    quantos: 1
    duracao: 180
    nota: Um mago que cutuca com dano mágico de muito longe, um pouco a cada poucos segundos. Escudos mágicos e RM seguram.
    atacantes:
    - {nome: Mago de artilharia, funcao: mago, vida: 6000, armadura: 50, rm: 50, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 600, "% Magic Penetration": 20}, alcance: 600,
       pulsos: [{nome: Disparo de longe, tipo: dano, dano_tipo: magico, base: 220, pdh: 0.55, a_cada: 4, alcance: 1100}]}
  magos_explosivos:
    nome: Magos explosivos
    grupo: ameaca
    ameaca: [Explosivo]
    quantos: 2
    duracao: 120
    nota: Dois magos que soltam tudo de uma vez, com um atordoamento. Vale segurar a primeira explosão.
    atacantes:
    - {nome: Mago explosivo, funcao: mago, vida: 6000, armadura: 50, rm: 50, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 650, Magic Penetration: 15},
       pulsos: [{nome: Combo explosivo, tipo: dano, dano_tipo: magico, base: 550, pdh: 1.0, a_cada: 9, alcance: 650,
                 controle: atordoamento, duracao: 1.0}]}
    - {nome: Mago explosivo 2, funcao: mago, vida: 6000, armadura: 50, rm: 50, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 600},
       pulsos: [{nome: Combo explosivo, tipo: dano, dano_tipo: magico, base: 480, pdh: 0.9, a_cada: 9, alcance: 650}]}
  magos_batalha:
    nome: Magos de batalha
    grupo: ameaca
    ameaca: [Mago de Batalha]
    quantos: 1
    duracao: 180
    nota: Um mago de dano mágico contínuo de perto, com o Tormento de Liandry.
    atacantes:
