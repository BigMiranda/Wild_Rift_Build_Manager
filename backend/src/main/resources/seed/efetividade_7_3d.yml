       pulsos: [{nome: Golpe de lutador, tipo: dano, dano_tipo: fisico, base: 220, dda: 1.0, a_cada: 5, alcance: 300},
                {nome: Fôlego de lutador, tipo: cura, base: 260, a_cada: 8, alcance: 100}]}
  corrida_atirador_peel:
