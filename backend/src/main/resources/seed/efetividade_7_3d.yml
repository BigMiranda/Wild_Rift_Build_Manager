    grupo: corrida
    duracao: 60
    mortais: true
    escala_com_minuto: true
    nota: Um atirador com um suporte de proteção que o escuda, o cura e deixa a build lenta. Para vencer, é preciso derrubar o atirador através da proteção.
    atacantes:
    - {nome: Atirador protegido, funcao: atirador, vida: 3600, armadura: 90, rm: 60, dda: 300, velocidade_ataque: 1.7,
       status: {"% Critical Rate": 60, "% Armor Penetration": 25}, itens: [Sedenta por Sangue]}
    - {nome: Suporte de proteção, funcao: suporte, vida: 3000, armadura: 70, rm: 60, dda: 50, velocidade_ataque: 0.7,
       status: {Ability Power: 250},
       pulsos: [{nome: Escudo de proteção, tipo: escudo, base: 200, pdh: 0.5, a_cada: 7, alcance: 700, duracao: 2.5},
                {nome: Cura de proteção, tipo: cura, base: 110, pdh: 0.35, a_cada: 8, alcance: 700},
                {nome: Lentidão de proteção, tipo: controle, a_cada: 10, alcance: 700, controle: lentidao, lentidao: 0.4, duracao: 1.5}]}
  corrida_com_peel_aliado:
    nome: Corrida com um suporte aliado
    grupo: corrida
    duracao: 60
    mortais: true
    escala_com_minuto: true
    nota: A build com um suporte aliado que a escuda e a cura, contra um mergulhador e um atirador, como um carry joga de verdade.
    atacantes:
    - {nome: Mergulhador, funcao: lutador, vida: 4800, armadura: 140, rm: 90, dda: 250, velocidade_ataque: 1.1,
       status: {"% Armor Penetration": 15}, itens: [Hemodrenário],
       pulsos: [{nome: Mergulho, tipo: dano, dano_tipo: fisico, base: 220, dda: 1.0, a_cada: 7, alcance: 450,
                 controle: arremesso, duracao: 0.75}]}
    - {nome: Atirador, funcao: atirador, vida: 3600, armadura: 90, rm: 60, dda: 300, velocidade_ataque: 1.7,
       status: {"% Critical Rate": 60, "% Armor Penetration": 25}}
    aliados:
    - {nome: Suporte aliado, funcao: suporte, vida: 3000, armadura: 70, rm: 60, dda: 50, velocidade_ataque: 0.7,
       status: {Ability Power: 250},
       pulsos: [{nome: Escudo aliado, tipo: escudo, base: 220, pdh: 0.5, a_cada: 6, alcance: 700, duracao: 2.5},
                {nome: Cura aliada, tipo: cura, base: 120, pdh: 0.35, a_cada: 7, alcance: 700},
                {nome: Lentidão aliada, tipo: controle, a_cada: 9, alcance: 700, controle: lentidao, lentidao: 0.4, duracao: 1.5}]}

# Varreduras do relatório Completo: cada estágio muda um atributo do atacante de referência e mantém os outros.
# Os 5 estágios de cada dimensão são editáveis na tela (e voltam a estes com "Restaurar o padrão").
# A penetração % vai no máximo a 75% (decisão do usuário em 31/10/2026): acima disso a varredura usa 75%.
varredura:
  duracao: 180
  atacante:
    {nome: Atacante de referência, funcao: lutador, vida: 8000, armadura: 60, rm: 60, dda: 300, velocidade_ataque: 1.5,
     status: {Ability Power: 400},
     pulsos: [{nome: Golpe mágico, tipo: dano, dano_tipo: magico, base: 100, pdh: 0.6, a_cada: 5, alcance: 350}]}
  dimensoes:
  - {chave: pen_pct, nome: Penetração % física e mágica, estagios: [0, 10, 30, 50, 75]}
  - {chave: pen_pct_fisica, nome: Penetração % física, estagios: [0, 10, 30, 50, 75]}
  - {chave: pen_pct_magica, nome: Penetração % mágica, estagios: [0, 10, 30, 50, 75]}
  - {chave: pen_fixa, nome: Penetração fixa / letalidade, estagios: [0, 10, 20, 30, 40]}
  - {chave: critico, nome: Taxa de Crítico, estagios: [0, 25, 50, 75, 100]}
  - {chave: dda, nome: DdA, estagios: [0, 250, 500, 750, 1000]}
  - {chave: pdh, nome: PdH, estagios: [0, 500, 1000, 1500, 2000]}
  - {chave: resistencias, nome: Armadura e RM do atacante, estagios: [0, 500, 1000, 1500, 2000]}
  - {chave: vida, nome: Vida máx. do atacante, estagios: [0, 5000, 10000, 15000, 20000]}
  - {chave: inimigos, nome: Número de inimigos, estagios: [1, 2, 3, 4, 5]}

