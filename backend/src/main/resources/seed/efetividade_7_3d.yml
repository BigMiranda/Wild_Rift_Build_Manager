# Efetividade por cenários de teste (patch 7.3d): os presets dos cenários, as funções dos bonecos, as varreduras e os
# relatórios padrão. Tudo roda na Arena, pelas mesmas regras da luta (sem fórmula paralela); a build testada usa o
# cérebro Tático sem fuga e os efeitos condicionais dela disparam de verdade.
#
# Um cenário de teste é a build testada, num minuto, contra 1 a 5 bonecos atacantes, com 0 a 4 bonecos aliados, por
# uma duração. Nenhum boneco é um campeão: a função decide só o padrão de dano e a posição. Os atacantes não morrem
# (ficam com 1 de Vida): a luta dura até a build morrer ou acabar o tempo; a Vida deles conta só para o que lê a Vida
# do alvo (Coração de Aço, Ruptor...). Os aliados morrem normalmente.
#
# Por boneco (atacantes e aliados):
#   nome        como aparece nos relatórios
#   funcao      atirador | mago | lutador | assassino | tanque | suporte (ver `funcoes`)
#   vida, armadura, rm, dda (dano de ataque), velocidade_ataque (ataques por segundo, antes dos itens), vdm
#   status      outros status somados por cima, com os nomes do motor: Ability Power, % Critical Rate,
#               % Armor Penetration, Armor Penetration (letalidade), % Magic Penetration, Magic Penetration,
#               % Lifesteal, % Omnivamp, % Attack Speed...
#   itens       itens da loja (nomes da loja pt-BR), com os status, passivas e efeitos de combate_7_3d.yml, como na luta
#   alcance     alcance de ataque; sem o campo, o da função
#               (os magos dos presets têm dda 0: só as habilidades, todas de Dano Mágico)
#   pulsos      padrão de habilidades genéricas; sem o campo, o da função. Cada pulso:
#                 {nome, tipo: dano | escudo | cura, dano_tipo: fisico | magico | verdadeiro, base, dda, pdh,
#                  a_cada (s), alcance, duracao (s, escudo)}
#               dano = base + dda x Dano de Ataque + pdh x Poder de Habilidade; o dano vai ao inimigo que o boneco
#               enfrenta (pelas resistências, penetrações e efeitos de habilidade dos itens dele, como Liandry); escudo
#               e cura vão ao aliado com menos Vida (proporcional) no alcance, ele mesmo incluído.
#
# Por cenário: nome, grupo (1x1 | equipe | ameaca | suporte | corrida), atacantes, aliados, duracao (s), nota (o que
# acontece no teste, mostrada nas telas e no site), escala_com_minuto, mortais (Rodada 15: os atacantes morrem).
#
# O que muda com o minuto testado: só a build (itens, nível, status). O atacante tem os status fixos do preset, em
# qualquer minuto, e por isso builds em minutos diferentes se comparam. Com `escala_com_minuto: true` (desligado nos
# presets; os cenários do usuário podem ligar) a Vida, o DdA, o PdH e a base dos pulsos dele seguem o minuto, pela regra
# de `escala_com_minuto` abaixo; os itens não mudam.
#
# A referência padrão é o mesmo campeão, no mesmo nível, sem itens, com as runas da build, contra o mesmo atacante: ela
# roda no primeiro minuto daquele nível, então dois minutos do mesmo nível têm a mesma referência (o Crescimento
# Excessivo, que cresce com o relógio, não entra na diferença).
#
# A build testada usa o Tático sem fuga (`tactical_stand`): nunca recua nem usa o Flash para escapar. A Arena é uma
# rota reta, sem para onde ir: quem foge vive até a parede, e o tempo até morrer passaria a medir a caminhada (com 400
# de Vida a mais, o Ornn sem itens ia de 2,8 s para 20,8 s contra o mesmo atacante).
#
# Cura dos atacantes: como um campeão de verdade, por itens reais. Atiradores: Sedenta por Sangue (Roubo de Vida). Lutadores:
# Hemodrenário (Vampirismo Universal). Magos de Liandry + Maldição e de 1000 de PdH: Criafendas. O DdA e o PdH desses itens
# foram descontados do preset, para o total seguir o mesmo. Os atacantes não morrem, então a cura deles não muda o tempo até
# a build morrer: ela aparece como "cura cortada" e no valor medido do corta-cura (o dano que fica).
#
# Medidas (as mesmas para todo cenário): tempo até morrer; vida efetiva contra aquele atacante (o dano bruto recebido
# até morrer); dano mitigado %; escudo absorvido; cura (e a perdida para Feridas Dolorosas); dano devolvido (o que a
# build causou aos atacantes) e tempo de controle aplicado neles; com aliados, a % do dano inimigo que a build absorveu
# e o tempo vivo dos aliados. As lutas são longas (180 s nos 1x1, o máximo da Arena) para a build morrer de verdade;
# se ela sobrevive, o tempo até morrer aparece como "> duração", sem estimativa. Taxa líquida: dano recebido depois das
# mitigações, menos a cura e o escudo recebidos, por segundo da luta. A cura que encontrou a Vida cheia conta: é o que dá
# a "sobra por segundo" de quem sustenta.
#
# Pontuação de efetividade: quanto da taxa líquida da referência a build cancela, em %:
#   100 × (taxa da referência − taxa da build) ÷ taxa da referência
# com a taxa em % da Vida máxima de cada um por segundo. Sem teto e sem salto quando ninguém morre: 0 = igual à referência,
# 50 = dura o dobro, 75 = dura 4 vezes, 90 = dura 10 vezes, 100 = não perde Vida, acima de 100 = se cura mais do que apanha,
# abaixo de 0 = pior que a referência.
patch: "7.3d"

# Cenários com `escala_com_minuto`: fator = minuto da build / minuto_cheio, entre minimo e maximo.
escala_com_minuto: {minuto_cheio: 25, minimo: 0.2, maximo: 1.4}

# taxa: por_vida (% da Vida máxima por segundo) | bruta (dano por segundo). Na `bruta` a Vida não conta: um item só de Vida
# não muda a taxa, e uma build que dura mais pode ter pontuação menor (ver docs/rodada-7.md).
# notas: da melhor para a pior, cada uma com a menor pontuação que a alcança. Só valem contra a referência padrão.
indice:
  taxa: por_vida
  notas:
  - {nota: perfeito, de: 100}   # não perde Vida
  - {nota: otimo, de: 90}       # dura 10 vezes mais que sem itens
  - {nota: bom, de: 75}         # 4 vezes
  - {nota: regular, de: 50}     # 2 vezes
  - {nota: ruim, de: 25}        # 1,33 vez
  - {nota: pessimo}

funcoes:
  atirador:
    alcance: 525
    posicao: tras
    pulsos:
    - {nome: Habilidade de atirador, tipo: dano, dano_tipo: fisico, base: 80, dda: 0.6, a_cada: 8, alcance: 700}
  mago:
    alcance: 500
    posicao: tras
    pulsos:
    - {nome: Combo de mago, tipo: dano, dano_tipo: magico, base: 350, pdh: 0.9, a_cada: 5, alcance: 650}
    - {nome: Toque de mago, tipo: dano, dano_tipo: magico, base: 120, pdh: 0.4, a_cada: 2, alcance: 650}
  lutador:
    alcance: 150
    posicao: frente
    pulsos:
    - {nome: Golpe de lutador, tipo: dano, dano_tipo: fisico, base: 120, dda: 0.8, a_cada: 6, alcance: 300}
  assassino:
    alcance: 125
    posicao: frente
    pulsos:
    - {nome: Explosão de assassino, tipo: dano, dano_tipo: fisico, base: 200, dda: 1.0, a_cada: 7, alcance: 400}
  tanque:
    alcance: 150
    posicao: frente
    pulsos:
    - {nome: Golpe de tanque, tipo: dano, dano_tipo: magico, base: 120, pdh: 0.5, a_cada: 8, alcance: 350}
  suporte:
    alcance: 500
    posicao: tras
    pulsos:
    - {nome: Escudo de suporte, tipo: escudo, base: 150, pdh: 0.5, a_cada: 6, alcance: 600, duracao: 2.5}
    - {nome: Toque de suporte, tipo: dano, dano_tipo: magico, base: 60, pdh: 0.3, a_cada: 5, alcance: 600}

# Os presets só se duplicam (a cópia vira um cenário do usuário).
cenarios:
  critico:
    nome: Crítico
    grupo: 1x1
    duracao: 180
    nota: Um atirador que só dá ataques básicos, todos críticos (300 de DdA, 2,5 ataques por segundo), e se cura com o Roubo de Vida da Sedenta por Sangue. Armadura e o que reduz crítico ou velocidade de ataque seguram mais.
    atacantes:
    - {nome: Atirador crítico, funcao: atirador, vida: 8000, armadura: 60, rm: 60, dda: 225, velocidade_ataque: 2.5,
       status: {"% Critical Rate": 100}, itens: [Sedenta por Sangue], pulsos: []}
  anti_tanque_fisico:
    nome: Anti-tanque físico
    grupo: 1x1
    duracao: 180
    nota: 'Um lutador feito para derrubar tanques: dano por % da Vida (Espada do Rei Destruído), penetração de Armadura (Lembranças) e cura pelo Hemodrenário. Empilhar Vida rende menos aqui.'
    atacantes:
    - {nome: Lutador anti-tanque, funcao: lutador, vida: 8000, armadura: 60, rm: 60, dda: 210, velocidade_ataque: 1.5,
       itens: [Espada do Rei Destruído, Ruptor Divino, Lembranças do Lorde Dominik, Hemodrenário]}
  liandry:
    nome: Tormento de Liandry
    grupo: 1x1
    duracao: 180
    nota: Um mago que queima a Vida máxima com o Tormento de Liandry, dano mágico contínuo. Resistência Mágica e cura seguram; Vida pura alimenta a queimadura.
    atacantes:
    - {nome: Mago de Liandry, funcao: mago, vida: 8000, armadura: 60, rm: 60, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 600}, itens: [Tormento de Liandry]}
  liandry_maldicao:
    nome: Liandry + Maldição Sanguinária
    grupo: 1x1
    duracao: 180
    nota: O mago do Liandry com a Maldição Sanguinária, que corta a Resistência Mágica a cada acerto, e o Criafendas, que o cura. Testa a RM quando ela é reduzida.
    atacantes:
    - {nome: Mago de Liandry e Maldição, funcao: mago, vida: 8000, armadura: 60, rm: 60, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 530}, itens: [Tormento de Liandry, Maldição Sanguinária, Criafendas]}
  cajado_vazio:
    nome: Cajado do Vazio
    grupo: 1x1
    duracao: 180
    nota: 'Um mago com o Cajado do Vazio (40% de penetração mágica): a Resistência Mágica vale menos, a Vida segura melhor.'
    atacantes:
    - {nome: Mago do Cajado, funcao: mago, vida: 8000, armadura: 60, rm: 60, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 600}, itens: [Cajado do Vazio]}
  pdh_1000_cajado:
    nome: 1000 de PdH + Cajado do Vazio
    grupo: 1x1
    duracao: 180
    nota: 'Um mago no fim de jogo: 1.000 de PdH, Cajado do Vazio e Criafendas. Explosões mágicas grandes.'
    atacantes:
    - {nome: Mago de 1000 PdH, funcao: mago, vida: 8000, armadura: 60, rm: 60, dda: 0, velocidade_ataque: 0.7,
       status: {Ability Power: 930}, itens: [Cajado do Vazio, Criafendas]}
  misto:
    nome: Misto
    grupo: 1x1
    duracao: 180
    nota: 'Um lutador que mistura ataques físicos e habilidades mágicas, com o Hemodrenário: testa se a build só se defende de um tipo de dano.'
    atacantes:
    - {nome: Lutador misto, funcao: lutador, vida: 8000, armadura: 60, rm: 60, dda: 260, velocidade_ataque: 1.5,
       status: {Ability Power: 500}, itens: [Hemodrenário],
       pulsos: [{nome: Golpe mágico, tipo: dano, dano_tipo: magico, base: 150, pdh: 0.7, a_cada: 5, alcance: 350}]}
  verdadeiro:
    nome: Verdadeiro
    grupo: 1x1
    duracao: 180
    nota: 'Um lutador cujas habilidades causam Dano Verdadeiro, que ignora Armadura e RM: só Vida, escudos, cura e redução de dano ajudam.'
    atacantes:
    - {nome: Lutador verdadeiro, funcao: lutador, vida: 8000, armadura: 60, rm: 60, dda: 160, velocidade_ataque: 1.2,
       itens: [Hemodrenário],
       pulsos: [{nome: Golpe verdadeiro, tipo: dano, dano_tipo: verdadeiro, base: 400, dda: 0.5, a_cada: 3, alcance: 300}]}
  atirador_alimentado:
    nome: Atirador alimentado
    grupo: 1x1
    duracao: 180
    nota: 'Um atirador com a build completa (Gume do Infinito, Lembranças, Dança da Morte, Sedenta por Sangue): muito dano físico, penetração e cura.'
    atacantes:
    - {nome: Atirador alimentado, funcao: atirador, vida: 8000, armadura: 60, rm: 60, dda: 175, velocidade_ataque: 1.5,
       status: {"% Critical Rate": 25},
       itens: [Gume do Infinito, Lembranças do Lorde Dominik, Canhão Fumegante, Dança da Morte, Sedenta por Sangue]}
  cinco_contra_um:
    nome: 5 contra 1
    grupo: equipe
    duracao: 120
    nota: 'A build sozinha contra cinco: atirador, mago, lutador, assassino e tanque. Mede quanto ela aguenta sendo o alvo de todos.'
    atacantes:
    - {nome: Atirador, funcao: atirador, vida: 6000, armadura: 50, rm: 50, dda: 300, velocidade_ataque: 1.5,
       status: {"% Critical Rate": 50}}
    - {nome: Mago, funcao: mago, vida: 6000, armadura: 50, rm: 50, dda: 60, velocidade_ataque: 0.7,
       status: {Ability Power: 600, "% Magic Penetration": 20}}
    - {nome: Lutador, funcao: lutador, vida: 6000, armadura: 60, rm: 60, dda: 210, velocidade_ataque: 1.2,
       status: {"% Armor Penetration": 20}, itens: [Hemodrenário]}
    - {nome: Assassino, funcao: assassino, vida: 6000, armadura: 50, rm: 50, dda: 280, velocidade_ataque: 1.2,
       status: {Armor Penetration: 18}}
    - {nome: Tanque, funcao: tanque, vida: 8000, armadura: 120, rm: 80, dda: 100, velocidade_ataque: 0.7,
       status: {Ability Power: 100}}
  luta_de_equipe:
    nome: Luta de equipe genérica
    grupo: equipe
    duracao: 120
    nota: 'Os mesmos cinco do "5 contra 1", agora com quatro aliados ao lado da build (suporte, atirador, mago e lutador). Mede quanto dano ela segura pelo time e quanto tempo os aliados ficam vivos.'
    atacantes:
    - {nome: Atirador, funcao: atirador, vida: 6000, armadura: 50, rm: 50, dda: 300, velocidade_ataque: 1.5,
       status: {"% Critical Rate": 50}}
    - {nome: Mago, funcao: mago, vida: 6000, armadura: 50, rm: 50, dda: 60, velocidade_ataque: 0.7,
       status: {Ability Power: 600, "% Magic Penetration": 20}}
    - {nome: Lutador, funcao: lutador, vida: 6000, armadura: 60, rm: 60, dda: 210, velocidade_ataque: 1.2,
       status: {"% Armor Penetration": 20}, itens: [Hemodrenário]}
    - {nome: Assassino, funcao: assassino, vida: 6000, armadura: 50, rm: 50, dda: 280, velocidade_ataque: 1.2,
       status: {Armor Penetration: 18}}
    - {nome: Tanque, funcao: tanque, vida: 8000, armadura: 120, rm: 80, dda: 100, velocidade_ataque: 0.7,
       status: {Ability Power: 100}}
    aliados:
