  basico:
    nome: Básico
    cenarios:
    - {cenario: critico, peso: 1}
    - {cenario: anti_tanque_fisico, peso: 1}
    - {cenario: liandry, peso: 1}
    - {cenario: liandry_maldicao, peso: 1}
    - {cenario: cajado_vazio, peso: 1}
    - {cenario: pdh_1000_cajado, peso: 1}
    - {cenario: misto, peso: 1}
    - {cenario: verdadeiro, peso: 1}
    - {cenario: atirador_alimentado, peso: 1}
  completo:
    nome: Completo
    cenarios:
    - {cenario: critico, peso: 1}
    - {cenario: anti_tanque_fisico, peso: 1}
    - {cenario: liandry, peso: 1}
    - {cenario: liandry_maldicao, peso: 1}
    - {cenario: cajado_vazio, peso: 1}
    - {cenario: pdh_1000_cajado, peso: 1}
    - {cenario: misto, peso: 1}
    - {cenario: verdadeiro, peso: 1}
    - {cenario: atirador_alimentado, peso: 1}
    - {cenario: cinco_contra_um, peso: 1}
    - {cenario: luta_de_equipe, peso: 1}
    varreduras: [pen_pct, pen_pct_fisica, pen_pct_magica, pen_fixa, critico, dda, pdh, resistencias, vida, inimigos]
