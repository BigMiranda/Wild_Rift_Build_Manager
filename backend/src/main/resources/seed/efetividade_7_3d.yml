       status: {"% Critical Rate": 50}, alvo_aliado: 0}
    aliados:
    - {nome: Atirador aliado, funcao: atirador, vida: 3800, armadura: 45, rm: 40, dda: 230, velocidade_ataque: 1.3,
       status: {"% Critical Rate": 50}}
  dupla_contra_dupla:
    nome: Dupla contra dupla
    grupo: suporte
    duracao: 60
    nota: A build e um atirador aliado contra um atirador e um encantador, como na fase de rotas da dupla.
    atacantes:
    - {nome: Atirador inimigo, funcao: atirador, vida: 5000, armadura: 45, rm: 40, dda: 220, velocidade_ataque: 1.3,
       status: {"% Critical Rate": 50}, alvo_aliado: 0}
    - {nome: Encantador inimigo, funcao: suporte, vida: 4500, armadura: 45, rm: 45, dda: 50, velocidade_ataque: 0.7,
       status: {Ability Power: 300},
       pulsos: [{nome: Escudo de encantador, tipo: escudo, base: 180, pdh: 0.5, a_cada: 7, alcance: 700, duracao: 2.5},
                {nome: Toque de encantador, tipo: dano, dano_tipo: magico, base: 120, pdh: 0.4, a_cada: 5, alcance: 650,
                 controle: lentidao, lentidao: 0.3, duracao: 1.5}]}
    aliados:
    - {nome: Atirador aliado, funcao: atirador, vida: 3800, armadura: 45, rm: 40, dda: 230, velocidade_ataque: 1.3,
       status: {"% Critical Rate": 50}}

  # ---------------------------------------------------------------- corrida (Rodada 15)
  # Atacantes que MORREM (`mortais: true`): a luta acaba quando a barra de um dos lados zera. Matar acaba com o dano
  # deles, então dano, dano devolvido e corta-cura valem o que valem no jogo. Os atacantes crescem com o minuto testado
  # (`escala_com_minuto`: Vida e dano de um campeão daquela fase; os números abaixo são os do minuto 25). A medida é a
  # corrida das barras de vida (Measures.race; parte `corrida` de nota_builds_7_3d.yml).
  corrida_atirador:
    nome: Corrida contra um atirador
    grupo: corrida
    duracao: 60
    mortais: true
    escala_com_minuto: true
    nota: 'Um atirador sozinho, só batendo, que se cura com a Sedenta por Sangue. Quem zera a barra do outro primeiro?'
    atacantes:
    - {nome: Atirador, funcao: atirador, vida: 3600, armadura: 90, rm: 60, dda: 300, velocidade_ataque: 1.7,
       status: {"% Critical Rate": 60, "% Armor Penetration": 25}, itens: [Sedenta por Sangue]}
  corrida_lutador:
