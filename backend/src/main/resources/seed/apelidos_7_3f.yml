# Rodada 20, Parte 2: apelidos do leitor de voz (frontend/src/voiceParser.js), por tipo. O que se fala -> o nome do
# catálogo (campeões, feitiços, runas e itens de loja_7_3f.yml, como o jogo escreve em pt-BR). Editáveis em
# Admin › Catálogo › Apelidos da voz: o que o usuário muda fica na tabela draft_apelido, por cima deste arquivo.
#
# O leitor já casa os nomes do catálogo sem acento, sem caixa e com tolerância (distância de edição e uma semelhança
# fonética simples). Os apelidos servem para o que não se parece com o nome: siglas, nomes em inglês, encurtamentos.
#
# rotas, lados e objetivos são as palavras da gramática (o que vira rota, time e evento).
