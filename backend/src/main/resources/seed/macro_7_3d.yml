# Macro roteirizada da partida inteira (arena/rift/ScriptedMacro): valores meus (EST), para ajustar. A macro é trocável pela
# interface MacroPolicy; a treinada é a NeuralMacro (proposta-macro-treinada.md).
fonte: "EST"
ultimos_golpes:            # chance de o campeão mais próximo da função levar o último golpe da tropa
  barao: 0.75
  meio: 0.80
  dupla: 0.85
  selva: 0.30
  suporte: 0.05
pressionar_vida: 0.35      # com os rotas inimigos da rota mortos, na base ou voltando, fica e pressiona (onda e torre) em vez de voltar para comprar, acima desta Vida
voltar_vida: 0.30          # volta à base abaixo desta fração da Vida
voltar_ouro: 1600          # ou com este ouro na mão, se ele paga a próxima compra; 1100 até a calibragem pela macro treinada (08/11/2026)
volta_s: 8                 # segundos de canalização da volta
objetivo_depois_de: 5      # minuto a partir do qual selva e meio giram para os objetivos
agrupar_aos: 14            # minuto em que todos agrupam e empurram uma rota
defender_cedo_com: 3       # antes de agrupar, a estrutura (fora a base) com esta quantidade de inimigos a 1.500 chama o time
defender_com: 2            # depois de agrupar, sem vantagem, defende a estrutura com esta quantidade de inimigos a 1.500
empurrar_com_mortos: 3     # depois de agrupar, empurra antes de ir ao objetivo com a Mão do Barão ou com esta quantidade de inimigos mortos
luta_distancia: 900        # inimigos a esta distância, com a linha livre, podem lutar
luta_raio: 1300            # quem está neste raio entra na luta
luta_vantagem: 1.5         # a luta sai com esta vantagem de força (Vida × dano), ou com luta_chance a cada passo; 2.2 até a calibragem das lutas (08/11/2026)
luta_chance: 0.003
luta_pausa: 30             # segundos sem nova luta para quem acabou de lutar
luta_duracao: 20           # teto de uma luta no passo fino
luta_calma: 3              # a luta acaba com este tempo sem dano
limpar_onda: 1.0           # parte do dano do campeão em rota que vai à onda inimiga à frente (últimos golpes e algumas habilidades)
limpar_onda_alcance: 700   # até onde a onda inimiga precisa estar para o campeão em rota bater nela
ritmo_monstros: 2.5        # dano em monstros e objetivos: ataques mais habilidades, sobre o dano de ataque por segundo
dano_monstros: 0.2         # fração do dano do monstro que chega, com o desvio e o escudo dos primeiros níveis
renascer_base: 6           # tempo de renascer: base + por nível
renascer_por_nivel: 2.5
# Dois tempos (Rodada 10, Parte 2): ferido ou com ouro para o próximo item, a macro pesa ficar e trocar contra recuar
# para o Frutomel, voltar à base a pé ou de Teleporte e comprar onde está (arena/rift/TwoTempo). Tudo em ouro sobre o
# mesmo horizonte. Pesos meus (EST), para calibrar.
dois_tempos:
  ligado: true
  pensar_abaixo: 0.55      # pensa em sair abaixo desta fração da Vida (ou com ouro para o próximo item); 0.8 até a calibragem pela macro treinada (08/11/2026)
  horizonte_s: 40          # segundos em que cada opção é medida
  ouro_por_xp: 0.6         # ouro que 1 de XP vale
  negacao_xp: 0.5          # parte a mais da XP perdida: o inimigo ganha nível na frente
  ouro_por_placa: 150
  peso_placas: 1.0
  ouro_por_vida: 0.1       # ouro que uma barra de Vida cheia vale, por ponto de Vida máxima, fora o risco de morrer
  folga_vida: 0.8          # parte da Vida que conta antes de morrer (a troca não é exata)
  peso_item: 0.5           # parte do ganho do item que conta agora
  comer_s: 1               # segundos para quebrar o Frutomel e pisar nos frutos
  na_base_s: 2             # segundos na base para comprar
  custo_teleporte: 120     # ouro que gastar o Teleporte agora custa (não tê-lo depois)
  margem: 40               # ficar vence empates e vantagens pequenas
  ouro_medio_tropa: 50
regen_por_s: 0.004         # fração da Vida máxima que volta por segundo fora da troca (com o dois_tempos)
dano_troca_por_s: 0.012    # fração da Vida que a troca tira por segundo contra um campeão igual: a previsão dos dois tempos e, desde a calibragem da troca (08/11/2026), a troca aplicada no passo grosso
troca_piso: 0.05           # a troca sozinha não desce a Vida abaixo disto: a luta decide
custo_morte: 600           # ouro que o inimigo ganha e o tempo fora valem, além da rota perdida
placas_por_s_ausente: 0.03 # placas que o inimigo tira por segundo com o campeão fora da rota
frutomel_ate: 3000         # até onde vai buscar o Frutomel
teleporte_s: 3.5           # feiticos_7_3d.yml
teleporte_recarga: 150     # feiticos_7_3d.yml
teleporte_estruturas_ate: 360   # só até estruturas nos 6 primeiros minutos (feiticos_7_3d.yml)
# Rodada 14: estilos de jogo na fase de rotas, um por assento (MatchModel.Slot.style; sem estilo = padrao, como antes).
# Os números são premissas (EST) a calibrar pelas partidas; nenhum cita campeão:
#   causa / sofre     multiplicam o dano da troca que o assento causa ao adversário de rota e o que ele sofre
#   ultimos_golpes    multiplica a chance dele de levar o último golpe da tropa (recuado perde alguns)
#   negar             parte da XP e do ouro das tropas que o adversário de rota perde quando este assento está à
#                     frente em Vida por mais de `negar_margem` (ele fica na borda do raio de XP e perde últimos golpes)
#   a_cada_s, desde_s, duracao_s   janelas em que o assento sai da rota: roaming (meio vai ao barão e ao dragão
#                     alternados; os outros, ao meio) e ganks (a selva vai ao rota inimigo com menos Vida, abaixo de
#                     `vida_abaixo`)
#   visao_raio        com este assento vivo, o time tem sentinelas: um rota vê um gank chegando a esta distância e recua
negar_margem: 0.1
estilos_rota:
  padrao: {}
  trocas_curtas: {causa: 0.8, sofre: 0.55}
  trocas_longas: {causa: 1.25, sofre: 1.2}
  recuado: {causa: 0.15, sofre: 0.25, ultimos_golpes: 0.85}
  pressao: {causa: 1.0, sofre: 0.95, negar: 0.35}
  roaming: {a_cada_s: 100, desde_s: 180, duracao_s: 35, ultimos_golpes: 0.9}
  ganks: {a_cada_s: 75, desde_s: 150, duracao_s: 30, vida_abaixo: 0.7}
  visao: {visao_raio: 1800, causa: 0.9}
# Os estilos que a campanha mede por rival (partidas 1x1 na rota até os 10 min): os que saem da rota (roaming, ganks,
# visão) precisam das outras rotas e ficam para as partidas inteiras.
estilos_avaliados: [padrao, trocas_curtas, trocas_longas, recuado, pressao]

# Treino da macro (proposta-macro-treinada.md, Parte 3, arena/MacroTraining): a nota de cada partida para o lado da macro
# treinada. Pesos meus (EST); o treino só usa a ordem das notas, então importa o que pesa mais, não a escala.
treino_macro:
  vitoria: 1.0             # vitória +1, derrota -1, empate (limite de tempo) 0
  cedo: 0.2                # a mais por vencer cedo (proporcional ao tempo que sobra até o limite); a menos por perder cedo
  ouro: 0.5                # diferença de ouro dos times, sobre o ouro dos dois
  aceite: 0.55             # taxa de vitória mínima contra o roteiro na validação para aceitar a versão
