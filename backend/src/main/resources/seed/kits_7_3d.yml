# Patch 7.3d: cópia do 7.3b com as mudanças do 7.3c e do 7.3d tiradas das notas de patch oficiais, não de prints
# (levantamento e fontes em docs/patches/7.3c-7.3d.md). Linhas mudadas por nota levam `fonte_7_3d: nota de patch`
# (as do 7.3a/7.3b seguem com `fonte_7_3b`; histórico em docs/patches/7.3a-7.3b.md).
# Quando houver prints deste patch, eles prevalecem sobre as notas.
#
# Fichas de habilidades para o confronto orquestrado (arena): geometria, tempos e efeitos de cada habilidade.
#
# Fontes (anotadas em `fontes` de cada habilidade):
#   WR  wiki de League of Legends, páginas do Wild Rift (https://wiki.leagueoflegends.com/en-us/WR:<Campeão>):
#       recargas, conjuração, durações, dano e efeitos. Consultada em 11/10/2026.
#   PC  mesma wiki, páginas do LoL de PC (https://wiki.leagueoflegends.com/en-us/<Campeão>): alcance, largura, raio,
#       velocidade quando a página do Wild Rift não tem (o Wild Rift pode ter valores diferentes: conferir no Treino).
#   EST estimativa, sem fonte (anotada também em `nota`).
# Unidades: distância em unidades do jogo, tempo em segundos, velocidade em unidades/s.
#
# Por campeão: raio (corpo), alcance (ataque básico), espera_ataque (fração do intervalo de ataque antes do golpe sair),
# velocidade_projetil (ataques à distância), efeitos_de_forma (efeitos de campeão de campeoes_7_3d.yml que a arena liga e
# desliga sozinha no momento certo, em vez da escolha da build) e habilidades "1", "2", "3", "R".
#
# Por habilidade:
#   forma         linha (projétil reto) | area (círculo no lançador ou num ponto) | cone | avanco (o lançador avança) |
#                 alvo (precisa de um alvo no alcance) | ataque (fortalece o próximo ataque) | proprio (efeito em si) |
#                 canal (efeito repetido por um tempo, que acompanha o lançador) | campo (área que fica no chão) |
#                 elemental (ultimate do Ornn) | empurrao (Condenar da Vayne) | tudo_ou_nada (ultimate do K'Sante)
#   recarga       por rank; conjuracao: tempo parado antes do efeito; atraso: tempo até o efeito depois da conjuração
#   alcance, largura, raio, raio_interno, angulo (graus), velocidade, duracao, intervalo (canal / campo)
#   dano          {tipo: fisico | magico | verdadeiro, base, dda, dda_base, dda_bonus, pdh, vida_max_alvo, vida_bonus,
#                 arm_bonus, rm_bonus, vida_max}; listas são por rank; chave_nv15 = valor no nível 15 (pelo nível)
#   efeitos       aplicados em quem é atingido: lentidao + duracao, atordoa, arremessa (no ar), puxa, fragil, marca,
#                 acumulos (sangramento), reduz_rm / reduz_arm {pct, duracao}, cura_propria, escudo_proprio
#   recursos      furia: ganho / limiar; calor: ganho / zona de perigo / superaquecimento (Renekton, Rumble)
#   imune_deslocamento  num avanço (ou na reconjuração que avança): enquanto o avanço dura, puxões, empurrões e
#                 arremessos no campeão são anulados (só durante o avanço). cc_durante_avanco diz o que um atordoamento
#                 faz nesse tempo: continua_depois (padrão: o avanço segue e o atordoamento cai no fim, com o tempo que
#                 sobrar) ou interrompe (como sem imunidade). Num canal (forma canal), vale pela duração do canal.
#   imparavel     num canal: imune_deslocamento com os atordoamentos anulados (W do Ornn)
#
# Mecânicas que o texto do jogo não diz (por campeão):
#   mobilidade    slot -> avanco | salto | corrida | imune: os avanços próprios que tiram de uma habilidade de mira ou
#                 alcançam o alvo (a IA vê "o alvo tem avanço pronto"; o Flash é contado à parte). Sem o campo, a
#                 arena lê das fichas: forma avanco e alvo com salta.
#   fragil.ataques  o ataque do Ornn num alvo Frágil: efeito empurra (padrão; distância em empurra) ou arremessa
#                 (duracao em s, encadeando com um arremesso em curso pelo maior fim)
mapa:
  # Howling Abyss simplificado: uma rota reta entre os dois Nexus, com paredes dos dois lados. EST: a wiki não traz as
  # medidas do mapa do Wild Rift; ajuste aqui quando medir.
  comprimento: 10000
  largura: 1100
  nexus_azul: [500, 0]
  nexus_vermelho: [9500, 0]

campeoes:
  Ornn:
    raio: 80                 # PC
    alcance: 175             # WR
    espera_ataque: 0.219     # PC (21,875%)
    fragil:                  # passiva da W e da R: imobilizar um alvo Frágil
      dano: {tipo: magico, vida_max_alvo: 0.07, vida_max_alvo_nv15: 0.22}   # WR (pelo nível do Ornn)
      aumento_controle: 0.30                                                 # WR: +30% de duração
      ataques: {efeito: empurra, empurra: 150}   # WR: os ataques do Ornn num alvo Frágil o empurram e quebram o Frágil; distância EST
      # PERGUNTA ABERTA: o usuário joga contando que esse ataque "mantém o alvo no ar mais um pouco"; para testar,
      # use {efeito: arremessa, duracao: <s>} (o padrão continua o empurrão de ~0,15s)
    mobilidade: {"3": avanco}
    habilidades:
      "1":
        nome: Ruptura Vulcânica
        forma: linha
        recarga: [9, 8.5, 8, 7.5]
        conjuracao: 0.25
        alcance: 750
        largura: 130
        velocidade: 1800
        atravessa: true
        para_apos_campeao: 200
        dano: {tipo: fisico, base: [25, 60, 95, 130], dda: 1.1}
        efeitos: {lentidao: 0.55, duracao: 2}
        pilar: {atraso: 1.125, duracao: 4, raio: 100}
        fontes: "recarga, conjuração, dano, lentidão, pilar: WR; alcance, largura, velocidade: PC; raio do pilar: EST"
      "2":
        nome: Fôlego do Fole
        forma: canal
        recarga: [11.5, 11, 10.5, 10]
        duracao: 0.75
        intervalo: 0.15
        alcance: 500
        largura: 350
        avanca: 0.35         # anda 35% da velocidade de movimento durante o canal
        imparavel: true
        dano: {tipo: magico, vida_max_alvo: [0.10, 0.11, 0.12, 0.13]}   # total do canal
        ultimo_golpe: {fragil: 3}
        fontes: "recarga, duração (0,75s), dano, Frágil: WR; alcance: PC; largura: PC (raio 175); avanço: PC"
      "3":
        nome: Investida Calcinante
        forma: avanco
        recarga: [13, 12, 11, 10]
        conjuracao: 0.25
        alcance: 650
        velocidade: 1600
        raio: 150
        dano: {tipo: fisico, base: [80, 140, 200, 260], arm_bonus: 0.4, rm_bonus: 0.4}
        terreno: {raio: 360, arremessa: 1.25}     # ao bater em parede ou pilar: onda de choque
        destroi_pilar: true
        fontes: "recarga, conjuração, dano, arremesso: WR; alcance, velocidade, raios: PC"
      "R":
        nome: Chamado do Deus da Forja
        forma: elemental
        recarga: [90, 80, 70]
        conjuracao: 0.5
        distancia: 2550          # o elemental surge a esta distância, na direção mirada, e corre até o Ornn
        largura: 340
        comprimento: 480         # corpo ao longo do caminho; o meio dele é o ponto que anda (ida e volta)
        velocidade: 450
        velocidade_final: 1250   # acelera até esta velocidade
        aceleracao: 400          # EST
        dano: {tipo: magico, base: [125, 175, 225], pdh: 0.2}
        efeitos: {lentidao: [0.4, 0.5, 0.6], duracao: 2, fragil: 3}
        reconjurar:
          apos: 1.25             # WR: a reconjuração fica disponível 1,25s depois
          cabecada: 200          # EST: avanço curto do Ornn
          velocidade: 1250       # PC
          distancia: 1500        # EST: até onde o elemental devolvido corre
          dano: {tipo: magico, base: [125, 175, 225], pdh: 0.2}
          efeitos: {arremessa: 1.0, arremessa_demais: 0.5, fragil: 3}
          # SUPOSIÇÃO a confirmar com o usuário: a cabeçada anula puxões / empurrões / arremessos no Ornn enquanto dura,
          # e um atordoamento nesse tempo cai no fim dela
          imune_deslocamento: true
          cc_durante_avanco: continua_depois
        fontes: "recarga, conjuração, dano, lentidão, Frágil, janela da reconjuração, arremesso: WR; distância, largura, velocidades: PC; aceleração, cabeçada, distância da volta: EST; comprimento: usuário (≈ 4× o desenho anterior)"

