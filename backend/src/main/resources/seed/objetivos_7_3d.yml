    interna: {vida: 3000, armadura: 15, rm: 15, dda: 200, dda_passo: 8, dda_a_cada: 30, dda_de: 450, dda_passos: 25, ouro_local: 350, ouro_global: 25, fonte: "RPN 4.2, 6.2h e 7.0; ouro global: Guia do Rift (07/11/2026)"}
    base: {vida: 3200, armadura: 30, rm: 30, dda: 200, dda_passo: 8, dda_a_cada: 30, dda_de: 450, dda_passos: 25, ouro_local: 200, ouro_global: 25, fonte: "RPN 3.3, 4.2, 5.2, 6.2h e 7.0; ouro global: Guia do Rift (07/11/2026)"}
  nexo: {vida: 4000, armadura: 30, rm: 30, dda: 280, dda_passo: 8, dda_a_cada: 30, alcance: 750, fonte: "vida: NP 7.3a; dano: RPN 4.2; resistências e alcance: EST"}

