  pinstouro: {aparece: 75, renasce: 260, raio: 325, distancia: 900, fonte: "Jungle_plants (PC, estimativa); renasce (semente a cada 240 s + 20 s para abrir): Guia do Rift (07/11/2026)"}
  clarevidente: {aparece: 180, renasce: 120, revela_campeoes: 3, revela_outros: 12, raio: 1000, fonte: "Jungle_plants (PC, estimativa); no jogo, Florividente; renasce (100 s + 20 s para abrir) e revelação 3 / 12 s: Guia do Rift (07/11/2026)"}

objetivos:
  barao:
    aparece: {valor: 660, fonte: "RPN 6.2"}
    renasce: {valor: 210, fonte: "WR:Baron_pit"}
    vida: {valor: 9500, por_min: 180, fonte: "base: RPN 6.3; crescimento: EST"}
    dda: {valor: 200, por_nivel: 22, fonte: "RPN 4.2"}
    armadura: {valor: 120, fonte: "WR:Baron_pit"}
    rm: {valor: 70, fonte: "WR:Baron_pit"}
    velocidade_ataque: {valor: 0.5, fonte: "EST"}
    alcance: {valor: 1100, fonte: "EST: o fosso inteiro"}
    ciclo: {golpes: 5, fonte: "WR:Baron_pit: uma habilidade a cada 5 ou 6 ataques"}
    habilidades:
      - {nome: Poça Ácida, dano: {tipo: magico, base: 120, dda: 0.25}, lentidao: 0.3, duracao: 1, fonte: "WR:Baron_pit; lentidão: EST"}
      - {nome: Tentáculos, dano: {tipo: magico, base: 180, dda: 0.25}, arremessa: 1, fonte: "WR:Baron_pit"}
    olhar: {reducao: 0.5, duracao: 5, fonte: "WR:Baron_pit"}
    corrosao: {por_golpe: 3, duracao: 5, max: 50, fonte: "WR:Baron_pit"}
    veneno: {duracao: 5, a_cada: 0.5, dano: 15, fonte: "WR:Baron_pit; dano: EST"}
    imune_controle: {valor: true, fonte: "WR:Baron_pit (marcado para testar)"}
    ouro: {valor: 200, fonte: "WR:Baron_pit"}
    xp: {valor: 800, fonte: "EST"}
  mao_do_barao:
    duracao: {valor: 120, fonte: "Guia do Rift (07/11/2026) (a RPN 6.2 dava 90 à primeira)"}
    dda_pdh_por_min: {dda: 2, pdh: 3, base_dda: 24, base_pdh: 40, fonte: "EST: a página diz que cresce por minuto, sem números"}
    tropas:
      reducao_contra_campeoes: {combatente: 0.65, conjuradora: 0.65, canhao: 0.35, fonte: "NP 7.3d (55–75% e 35%; o meio da faixa)"}
      dano_contra_tropas: {combatente: 0.90, outras: 0.25, fonte: "NP 7.3d"}
      dano_contra_torres: {valor: 0.30, fonte: "NP 7.3d"}
  dragao:
    aparece: {valor: 360, fonte: "RPN 6.2"}
    renasce: {valor: 255, fonte: "Guia do Rift (07/11/2026) (era 270, RPN 4.2)"}
    some: {valor: 1110, em_luta: 1130, fonte: "Guia do Rift (07/11/2026): 18:30 (era 17:30, RPN 4.2); em luta: +20 s, como antes (EST)"}
    elementais_por_partida: {valor: 3, fonte: "Guia do Rift (07/11/2026): até 3, sem repetir; o terreno muda depois do 1º (fora do modelo)"}
    vida: {valor: 4000, por_nivel: 180, fonte: "RPN 4.2"}
    dda: {valor: 110, por_nivel: 12, fonte: "EST"}
    armadura: {valor: 40, fonte: "EST"}
    rm: {valor: 40, fonte: "EST"}
    velocidade_ataque: {valor: 0.5, fonte: "EST"}
    alcance: {valor: 500, fonte: "EST"}
    ouro_time: {valor: 40, fonte: "RPN 4.2"}
    xp: {valor: 400, fonte: "EST"}
    # Só há 3 dragões elementais no Wild Rift: Oceano, Montanha e Infernal (prints do usuário, 05/11/2026: o painel
    # "Mata-Dragões"). Gelo e os outros elementos do LoL de PC saíram. O 1º dragão abatido na partida define o elemento
    # da alma; a alma só vem ao time que pegar os 3 dragões.
    acumulos_para_alma: {valor: 3, fonte: "print do usuário (05/11/2026)"}
    ordem: {valores: [oceano, montanha, infernal], sorteada: true, fonte: "print do usuário (05/11/2026): a ordem muda por partida; a partida sorteia pela semente"}
    elementos:                  # o efeito de CADA dragão abatido, que acumula: 2 dragões dão o dobro
      # linhas como as de efeito de item: `valor` fixo, ou `ratio` de `ref` com `escopo: total` (o total do status depois
      # de somar as outras fontes, incluindo o fixo dos dragões; a Forja Viva não amplifica, como a Manto da Aurora)
      infernal:
        status:
          - {stat: "Attack Damage", ratio: 0.04, ref: "Attack Damage", escopo: total}
          - {stat: "Ability Power", ratio: 0.04, ref: "Ability Power", escopo: total}
        fonte: "print do usuário (05/11/2026): receba 4% de Dano de Ataque e Poder de Habilidade"
      montanha:
        status:
          - {stat: "Armor", valor: 4}
          - {stat: "Magic Resistance", valor: 4}
          - {stat: "Armor", ratio: 0.03, ref: "Armor", escopo: total}
          - {stat: "Magic Resistance", ratio: 0.03, ref: "Magic Resistance", escopo: total}
        fonte: "print do usuário (05/11/2026): recebe 4+3% de Armadura e Resistência Mágica"
      oceano:
        regeneracao_vida_perdida: 0.028
        a_cada: 5
        fonte: "print do usuário (05/11/2026): regenera 2,8% da Vida perdida a cada 5s"
    almas:
      # print do usuário (05/11/2026); os números do print (518 de cura e 228 de dano) são o valor naquele momento:
      # 250 + 48% de DdA adicional + 25% do PdH + 10% da Vida adicional, e 180 + 35% + 15% (conferidos em RiftMapTest)
      infernal: {dano: {tipo: adaptativo, base: 180, dda_bonus: 0.35, pdh: 0.15}, raio: 250, recarga: 5, fonte: "print do usuário (05/11/2026)"}
      montanha: {escudo: 350, apos: 5, fonte: "print do usuário (05/11/2026): sem dano de campeões inimigos ou torres"}
      oceano: {cura: {base: 250, dda_bonus: 0.48, pdh: 0.25, vida_bonus: 0.10}, duracao: 4, recarga: 6, fonte: "print do usuário (05/11/2026)"}
  anciao:
    aparece: {valor: 1140, apos_terceiro: true, fonte: "RPN 6.2; WR:Dragon_pit"}
    renasce: {valor: 270, fonte: "Guia do Rift (07/11/2026) (era 360, WR:Dragon_pit)"}
    vida: {valor: 7000, por_min: 120, fonte: "EST"}
    dda: {valor: 200, fonte: "EST"}
    armadura: {valor: 70, fonte: "EST"}
    rm: {valor: 70, fonte: "EST"}
    velocidade_ataque: {valor: 0.5, fonte: "EST"}
    alcance: {valor: 500, fonte: "EST"}
    buff: {duracao: 120, verdadeiro: 450, em: 3, executa_abaixo: 0.15, fonte: "WR:Dragon_Slayer; dano: RPN 6.2"}
  arauto:
    existe: {valor: false, fonte: "Guia do Rift (07/11/2026): EXISTE (surge aos 360 s, não volta, some se não for abatido em 690 s, invocado arremete contra a torre mais próxima); falta modelar, por isso false. A RPN 5.2 dizia que saiu"}

