  # e anda 6.703 unidades pela rota do meio do mapa retraçado até o centro, a 325/s: 20,6 s, então 45,6 s. Arredondado
  # para 46 (RiftMapTest confere a conta). Vermelho e Azul nascem 1 s depois.
  primeira_aparicao: {valor: 46, fonte: "usuário (05/11/2026), pela caminhada da 1ª onda do meio"}
  buffs_depois: {valor: 1, fonte: "usuário (05/11/2026)"}
  evolucao: {aos: 480, fonte: "WR:Monster"}
  acampamentos:
    Espinhento Vermelho: {vida: 2800, vida_ate: 4000, dda: 75, dda_ate: 135, armadura: 40, rm: 0, renasce: 150, ouro: 130, xp: 200, buff: vermelho, fonte: "WR:Monster; armadura e XP: EST"}
    Sentinela Azul: {vida: 2800, vida_ate: 4000, dda: 75, dda_ate: 135, armadura: 0, rm: 40, renasce: 150, ouro: 130, xp: 200, buff: azul, fonte: "WR:Monster; RM e XP: EST"}
    Lobos: {vida: 2100, vida_ate: 3000, dda: 60, dda_ate: 110, armadura: 10, rm: 10, renasce: 110, ouro: 95, xp: 150, fonte: "EST; renasce: Guia do Rift (07/11/2026)"}
    Aves Carniceiras: {vida: 2000, vida_ate: 2900, dda: 55, dda_ate: 100, armadura: 15, rm: 15, renasce: 110, ouro: 95, xp: 150, fonte: "EST; WR:Monster: 3 aves em vez de 5; renasce: Guia do Rift (07/11/2026)"}
    Krugs: {vida: 2300, vida_ate: 3200, dda: 60, dda_ate: 110, armadura: 25, rm: 0, renasce: 110, ouro: 95, xp: 150, fonte: "EST; renasce: Guia do Rift (07/11/2026)"}
    Gromp: {vida: 2300, vida_ate: 3200, dda: 80, dda_ate: 130, armadura: 0, rm: 0, renasce: 110, ouro: 95, xp: 150, fonte: "EST; renasce: Guia do Rift (07/11/2026)"}
  buffs:
    vermelho: {duracao: 90, lentidao: 0.20, queimadura: [11, 25], fonte: "WR:Monster"}
    vermelho_evoluido: {duracao: 90, dda: 10, pdh: 30, lentidao: 0.30, queimadura: [16.5, 37.5], fonte: "WR:Monster"}
    azul: {duracao: 90, aceleracao: 15, fonte: "WR:Monster"}
    azul_evoluido: {duracao: 90, aceleracao: 15, aceleracao_ult: 15, fonte: "WR:Monster"}
  aronguejo: {vida: 400, vida_por_min: 15, velocidade: 300, aparece: 90, renasce: 120, ouro: 60, xp: 60, fonte: "aparece: usuário (05/11/2026; o Guia do Rift diz 85 s); renasce: Guia do Rift (07/11/2026); WR:Monster só diz que foge ao ser atacado: EST"}

plantas:
