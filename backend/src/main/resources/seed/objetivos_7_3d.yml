# Regras de partida do Wild Rift, patch 7.3d: tropas, torres, selva, plantas, objetivos e ouro. Fontes e lacunas em
# docs/dados-mapa-objetivos.md. Marcas em `fonte`:
#   RPN riftpatchnotes.com (histórico de patches; o valor mais recente registrado)
#   WR  páginas WR: da wiki oficial
#   NP  nota de patch oficial (docs/patches/)
#   PC  LoL de PC, usado como último recurso: sempre estimativa
#   EST estimativa própria, sem fonte
#   USU dado informado pelo usuário ou print do usuário (vale mais que as fontes online)
# Consultado em 31/10/2026; dados do usuário de 05/11/2026 (Rodada 10). Tempos em segundos de partida; vida e dano por
# minuto (por_min) ou por nível (por_nivel).
fonte: "USU, RPN, WR, NP; PC e EST marcados"
data: "2026-11-07"

tropas:
  primeira_onda: {valor: 25, fonte: "usuário (05/11/2026): a contagem começa em 0:00 e uma onda nasce a cada 25 s"}
  intervalo: {valor: 25, fonte: "usuário (05/11/2026)"}
  # a janela de 25 s da RPN 4.2 (4:00 a 10:00) saiu: o intervalo é 25 s a partida inteira
  onda: {combatente: 3, conjuradora: 3, fonte: "PC (estimativa)"}
  canhao_a_cada: {valor: 3, fonte: "PC (estimativa)"}          # uma onda em cada 3 traz a Tropa de Canhão
  super_apos_torre_da_base: {valor: true, fonte: "Guia do Rift (07/11/2026): a Torre do Inibidor caída dá supertropas na rota (Riot, 2022, dizia que não havia inibidores)"}
  inibidor_renasce: {valor: 300, fonte: "Guia do Rift (07/11/2026): a torre volta como inibidor depois de um tempo e as supertropas param; o tempo é o do LoL de PC (EST)"}
  velocidade: {valor: 325, fonte: "PC (estimativa)"}
  bonus_velocidade: {aos: 480, valor: 25, a_cada: 150, ate: 1080, fonte: "Guia do Rift (07/11/2026): +25 de Velocidade de Movimento a partir de 8:00, sobe a cada 150 s até 18:00 (o tamanho de cada passo não está na ficha)"}
  agro: {valor: 1, fonte: "RPN 4.2"}                            # segundos
  alcance_alerta: {valor: 700, fonte: "PC (estimativa)"}
  tipos:
    combatente: {vida: 480, vida_por_min: 21, dda: 12, dda_por_min: 1.0, armadura: 0, rm: 0, velocidade_ataque: 1.25, alcance: 110, ouro: 60, xp: 60, fonte: "ouro: RPN 4.2; alcance, XP e status: PC (estimativa)"}
    conjuradora: {vida: 290, vida_por_min: 10, dda: 23, dda_por_min: 2.2, armadura: 0, rm: 0, velocidade_ataque: 0.67, alcance: 525, ouro: 40, xp: 30, fonte: "alcance: RPN 4.2; ouro: WR:Gold; XP e status: PC (estimativa)"}
    canhao: {vida: 900, vida_por_min: 30, dda: 40, dda_por_min: 3.0, armadura: 0, rm: 0, velocidade_ataque: 1.0, alcance: 300, ouro: 80, xp: 90, fonte: "alcance, ouro: RPN 4.2; a XP de 1800 da RPN não cabe na tabela de XP do planejador: XP e status: PC (estimativa)"}
    super: {vida: 1600, vida_por_min: 60, dda: 190, dda_por_min: 5.0, armadura: 30, rm: 0, velocidade_ataque: 0.85, alcance: 170, ouro: 40, xp: 90, fonte: "PC (estimativa)"}

