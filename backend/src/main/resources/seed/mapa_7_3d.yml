# RETRAÇADO PELO PRINT DO MINIMAPA (Rodada 10): capturas/7.3d/mapa/minimapa-base.png, print do usuário (05/11/2026),
# sem moitas nem plantas. Escala: 40 unidades por pixel do print; o centro do mapa é o ponto médio entre os dois Nexos
# (166,5; 156 px). Calibragem e conferência em docs/rodada-10.md. As paredes são a grade traçada por
# tools/mapa_minimapa.py (células de 200); moitas e plantas seguem como esquema até o segundo print.
#
# Coordenadas: origem no canto da base azul; x para a direita (rota do Dragão), y para cima (rota do Barão); de 0 a 12000.
# `espelha`: o que vale para o lado azul vale para o vermelho, refletido no centro: (x, y) -> (12000 - x, 12000 - y).
# Refletida, a rota do Barão de um lado cai onde fica a rota do Dragão do outro (as torres trocam de rota no espelho).
