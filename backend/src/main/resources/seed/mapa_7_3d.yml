#
# GEOMETRIA É UM ESQUEMA, NÃO UM TRAÇADO. Nenhuma fonte pública traz as medidas do mapa do Wild Rift, e a imagem da wiki
# recusou o download (31/10/2026). As posições vêm das coordenadas conhecidas do LoL de PC, na escala 0,807 (PC 14870 -> 12000),
# e as paredes e moitas são blocos que reproduzem a ideia das rotas e da selva. Marcadas `fonte: PC (estimativa)` ou `esquema`.
