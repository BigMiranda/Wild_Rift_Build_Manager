server.port=8080

# SQLite file lives next to where the backend is started (./data/ornn-planner.db by default).
planner.db-path=./data/ornn-planner.db
spring.datasource.url=jdbc:sqlite:${planner.db-path}?foreign_keys=on&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection keeps things simple and lock-free for a single user.
spring.datasource.hikari.maximum-pool-size=1

# schema.sql is run by SchemaManager (after migrations), not by Spring's initializer.
spring.sql.init.mode=never

# Seed files used when the catalog is empty (and by the admin "re-import" action).
planner.seed.catalog=classpath:seed/loja_7_3b.yml
planner.seed.prices=classpath:seed/precos_status.yml
# Game data of the current patch (7.3b: the 7.3 transcription plus the 7.3a/7.3b patch notes, docs/patches/).
# The *_7_3.yml files stay as history.
planner.seed.itemEffects=classpath:seed/efeitos_itens_7_3b.yml
planner.seed.combat=classpath:seed/combate_7_3b.yml
planner.seed.runes=classpath:seed/runas_7_3b.yml
planner.seed.spells=classpath:seed/feiticos_7_3b.yml
planner.seed.champions=classpath:seed/campeoes_7_3b.yml
planner.seed.kits=classpath:seed/kits_7_3b.yml

spring.jackson.default-property-inclusion=non_null
server.error.include-message=always
