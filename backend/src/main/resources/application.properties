server.port=8080

# SQLite file lives next to where the backend is started (./data/ornn-planner.db by default).
planner.db-path=./data/ornn-planner.db
spring.datasource.url=jdbc:sqlite:${planner.db-path}?foreign_keys=on&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection keeps things simple and lock-free for a single user.
spring.datasource.hikari.maximum-pool-size=1

# schema.sql is run by SchemaManager (after migrations), not by Spring's initializer.
spring.sql.init.mode=never

# Seed files used when the catalog is empty (and by the admin "re-import" action).
planner.seed.catalog=classpath:seed/loja_7_3.yml
planner.seed.prices=classpath:seed/precos_status.yml

spring.jackson.default-property-inclusion=non_null
server.error.include-message=always
